<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Pause safely and resume with human authority</title>
  <desc id="desc">Bring a qualified person into sensitive, ambiguous or high-impact work without hiding the decision inside another model call. An authorized, version-safe approve, correct, reject, request-information or escalate decision.</desc>
  <defs>
    <linearGradient id="thread-gradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#04C7EE"></stop>
      <stop offset="52%" stop-color="#146CFF"></stop>
      <stop offset="100%" stop-color="#7B3FF2"></stop>
    </linearGradient>
    <radialGradient id="background-glow-a" cx="88%" cy="5%" r="34%">
      <stop offset="0%" stop-color="#DDF8FD" stop-opacity="0.9"></stop>
      <stop offset="100%" stop-color="#F7FAFF" stop-opacity="0"></stop>
    </radialGradient>
    <radialGradient id="background-glow-b" cx="7%" cy="92%" r="30%">
      <stop offset="0%" stop-color="#EEE7FF" stop-opacity="0.75"></stop>
      <stop offset="100%" stop-color="#F7FAFF" stop-opacity="0"></stop>
    </radialGradient>
