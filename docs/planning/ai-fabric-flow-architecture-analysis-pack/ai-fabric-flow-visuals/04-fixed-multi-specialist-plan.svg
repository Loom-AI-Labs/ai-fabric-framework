  <title id="title">Complex work with explicit expertise and typed boundaries</title>
  <desc id="desc">Turn a repeatable business process into a traceable sequence of focused specialists instead of one oversized prompt. A deterministic, evidence-linked business result assembled from independently validated specialist outputs.</desc>
