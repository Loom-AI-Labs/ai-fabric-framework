<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">A smarter application, not just another chatbot</title>
  <desc id="desc">Give users natural-language access to live application capabilities without giving the model control of application logic. One evidence-grounded answer, recommendation or governed proposal returned through one dialogue owner.</desc>
