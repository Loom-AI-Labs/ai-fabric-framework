      products: "Live catalog assistant · Inventory copilot · Policy assistant · Account operations · Case intelligence",
      guardrail: "Application database = source of truth · Vector store = derived, rebuildable evidence",
      loopBack: true,
      columns: [
        {
          label: "Change",

  function escapeHtml(value) {
    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;");
  }

  function defs() {
    return `
      <defs>
        <linearGradient id="af-thread-gradient" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="var(--viz-series-1)"></stop>
          <stop offset="52%" stop-color="var(--viz-series-2)"></stop>
          <stop offset="100%" stop-color="var(--viz-series-3)"></stop>
        </linearGradient>
        <marker id="af-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="color-mix(in srgb, var(--viz-series-2) 62%, var(--border))"></path>
        </marker>
      </defs>`;
  }

  function nodeMarkup(x, y, width, height, node, kicker) {
    const tone = "tone-" + node.tone;
    return `
      <g>
        <rect class="af-node-box ${tone}" x="${x}" y="${y}" width="${width}" height="${height}" rx="15"></rect>
        <foreignObject x="${x}" y="${y}" width="${width}" height="${height}">
          <div xmlns="http://www.w3.org/1999/xhtml" class="af-node-html">
            <div class="af-node-kicker">${escapeHtml(kicker)}</div>
            <div class="af-node-title">${escapeHtml(node.title)}</div>
            <div class="af-node-detail">${escapeHtml(node.detail)}</div>
          </div>
        </foreignObject>
      </g>`;
  }

  function desktopDiagram(flow) {
    const width = 900;
    const height = 460;
    const columns = flow.columns;
    const margin = 26;
    const nodeWidth = Math.min(134, (width - margin * 2 - (columns.length - 1) * 18) / columns.length);
    const gap = columns.length > 1 ? (width - margin * 2 - nodeWidth * columns.length) / (columns.length - 1) : 0;
    const nodeHeight = 92;
    const groupTop = 78;
    const groupHeight = 302;
    const positions = [];

    columns.forEach((column, columnIndex) => {
      const x = margin + columnIndex * (nodeWidth + gap);
      const count = column.nodes.length;
      const verticalGap = count > 1 ? 12 : 0;
      const total = count * nodeHeight + (count - 1) * verticalGap;
      const startY = groupTop + (groupHeight - total) / 2;
      positions.push(column.nodes.map((node, nodeIndex) => ({
        node,
        x,
        y: startY + nodeIndex * (nodeHeight + verticalGap),
        width: nodeWidth,
        height: nodeHeight
      })));
    });

    let connectors = "";
    for (let index = 0; index < positions.length - 1; index += 1) {
      const fromGroup = positions[index];
      const toGroup = positions[index + 1];
      fromGroup.forEach((from) => {
        toGroup.forEach((to) => {
          const x1 = from.x + from.width;
          const y1 = from.y + from.height / 2;
          const x2 = to.x;
          const y2 = to.y + to.height / 2;
          const middle = (x1 + x2) / 2;
          connectors += `<path class="af-connector" marker-end="url(#af-arrow)" d="M ${x1} ${y1} C ${middle} ${y1}, ${middle} ${y2}, ${x2 - 5} ${y2}"></path>`;
        });
      });
    }

    if (flow.loopBack) {
      const first = positions[0][0];
      const last = positions[positions.length - 1][0];
      const y = 425;
      connectors += `<path class="af-connector af-connector-dashed" marker-end="url(#af-arrow)" d="M ${last.x + last.width / 2} ${last.y + last.height} C ${last.x + last.width / 2} ${y}, ${first.x + first.width / 2} ${y}, ${first.x + first.width / 2} ${first.y + first.height + 5}"></path>`;
    }

    let labels = "";
    let nodes = "";
    columns.forEach((column, index) => {
      const group = positions[index];
      const center = group[0].x + group[0].width / 2;
      labels += `<text class="af-stage-label" x="${center}" y="42">${escapeHtml(column.label)}</text>`;
      group.forEach((position, nodeIndex) => {
        nodes += nodeMarkup(
          position.x,
          position.y,
          position.width,
          position.height,
          position.node,
          column.nodes.length > 1 ? String(nodeIndex + 1).padStart(2, "0") : "FLOW"
        );
      });
    });

    return `${defs()}<path class="af-thread" d="M 28 16 L 872 16"></path>${connectors}${labels}${nodes}`;
  }

  function mobileDiagram(flow) {
    const width = 300;
    const nodeWidth = 248;
    const nodeHeight = 92;
    const nodeGap = 12;
    const stageGap = 42;
    let y = 42;
    let markup = defs();
    let previousCenter = null;
    const stagePositions = [];

    flow.columns.forEach((column) => {
      const labelY = y;
      y += 18;
      const group = [];
      column.nodes.forEach((node, index) => {
        if (index > 0) {
          y += nodeGap;
        }
        group.push({ node, x: 26, y, width: nodeWidth, height: nodeHeight });
        y += nodeHeight;
      });
      stagePositions.push({ column, labelY, group });
      y += stageGap;
    });

    const totalHeight = Math.max(500, y - 16);
    mobile.setAttribute("viewBox", `0 0 ${width} ${totalHeight}`);

    stagePositions.forEach((stage, stageIndex) => {
      const centerY = (stage.group[0].y + stage.group[stage.group.length - 1].y + nodeHeight) / 2;
      markup += `<text class="af-stage-label" x="150" y="${stage.labelY}">${escapeHtml(stage.column.label)}</text>`;
      if (previousCenter !== null) {
        markup += `<path class="af-connector" marker-end="url(#af-arrow)" d="M 150 ${previousCenter} L 150 ${stage.group[0].y - 8}"></path>`;
      }
      stage.group.forEach((position, nodeIndex) => {
        markup += nodeMarkup(
          position.x,
          position.y,
          position.width,
          position.height,
          position.node,
          stage.group.length > 1 ? String(nodeIndex + 1).padStart(2, "0") : "FLOW"
        );
      });
      previousCenter = stage.group[stage.group.length - 1].y + nodeHeight + 7;
      if (stageIndex === stagePositions.length - 1) {
        previousCenter = null;
      }
      if (stage.group.length > 1) {
        const x = 16;
        markup += `<path class="af-connector af-connector-dashed" d="M ${x} ${stage.group[0].y + nodeHeight / 2} L ${x} ${stage.group[stage.group.length - 1].y + nodeHeight / 2}"></path>`;
      }
      if (centerY < 0) {
        markup += "";
      }
    });

    if (flow.loopBack) {
      markup += `<path class="af-connector af-connector-dashed" d="M 282 ${totalHeight - 90} L 282 46"></path>`;
    }

    return markup;
  }

  function render(flowId) {
    const flow = flows.find((item) => item.id === flowId) || flows[0];
    root.querySelector("#af-flow-stage").textContent = flow.stage;
    root.querySelector("#af-flow-name").textContent = flow.name;
    root.querySelector("#af-flow-purpose").textContent = flow.purpose;
    root.querySelector("#af-flow-outcome").textContent = flow.outcome;
    root.querySelector("#af-flow-products").textContent = flow.products;
    root.querySelector("#af-flow-guardrail").textContent = flow.guardrail;

    selector.querySelectorAll("button").forEach((button) => {
      button.setAttribute("aria-pressed", String(button.dataset.flow === flow.id));
    });

    desktop.setAttribute("aria-label", `${flow.name}. ${flow.purpose} ${flow.outcome}`);
    mobile.setAttribute("aria-label", `${flow.name}. ${flow.purpose} ${flow.outcome}`);
    desktop.innerHTML = desktopDiagram(flow);
    mobile.innerHTML = mobileDiagram(flow);
    root.dataset.selectedFlow = flow.id;
  }

  flows.forEach((flow) => {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "btn btn-sm";
    button.dataset.flow = flow.id;
    button.textContent = flow.short;
    button.addEventListener("click", () => render(flow.id));
    selector.appendChild(button);
  });

  window.selectAIFabricBusinessFlow = render;
  render("landscape");
})();
</script>
