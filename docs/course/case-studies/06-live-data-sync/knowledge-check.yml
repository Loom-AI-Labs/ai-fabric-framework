    competency: stable-update
    prompt: What should an update do to vector identity?
    options:
      - id: a
        text: Create a second unrelated vector
      - id: b
        text: Preserve stable identity and replace stale projected content
      - id: c
        text: Keep the old vector until restart
      - id: d
        text: Change the database primary key
    correctOptionIds: [b]
    explanation: Stable logical identity supports idempotent replacement.
    sourcePaths:
      - examples/real-apps/ai-fabric-live-data-sync/src/test/java/com/ai/fabric/realapps/livesync/LiveDataSyncIntegrationTest.java
  - id: case-06-q3
    type: answer-reveal
