    type: multiple-choice
    competency: annotation-contract
    prompt: What do the live-sync annotations define?
    options:
      - id: a
        text: Entity vector-space identity
      - id: b
        text: Searchable content projection
      - id: c
        text: Typed context metadata
      - id: d
        text: Database authorization
    correctOptionIds: [a, b, c]
    explanation: Authorization remains application-owned; annotations describe AI evidence.
    sourcePaths:
      - examples/real-apps/ai-fabric-live-data-sync/src/main/java/com/ai/fabric/realapps/livesync/domain/SyncProduct.java
  - id: case-06-q2
