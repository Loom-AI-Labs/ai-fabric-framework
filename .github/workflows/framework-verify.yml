name: Framework Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  MAVEN_ARGS: -B -V --no-transfer-progress

jobs:
  provider-registry:
    name: Provider Registry
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install YAML parser
        run: python3 -m pip install --disable-pip-version-check --quiet pyyaml

      - name: Validate framework release guards
        run: .github/scripts/validate-framework-release-guards.sh

  maven-build:
    name: Maven Build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs:
      - provider-registry
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Verify Docker is available
        run: |
          docker --version
          docker info | head -5

      - name: Build, test, and install framework reactor
        run: |
          mvn ${MAVEN_ARGS} -f ai-infrastructure-module/pom.xml \
            -Dai.vector-db.lucene.cleanup-on-close=true \
            -pl '!integration-Testing/testcontainers-support,!integration-Testing/integration-tests,!integration-Testing/relationship-query-integration-tests,!integration-Testing/chat-session-integration-tests,!integration-Testing/behavior-integration-tests' \
            install
        env:
          MAVEN_OPTS: -Xmx2g

      - name: Compile restored integration test suites
        run: |
          mvn ${MAVEN_ARGS} -f ai-infrastructure-module/pom.xml \
            -pl integration-Testing/testcontainers-support,integration-Testing/integration-tests,integration-Testing/relationship-query-integration-tests,integration-Testing/chat-session-integration-tests,integration-Testing/behavior-integration-tests \
            -am \
            test-compile
        env:
          MAVEN_OPTS: -Xmx2g

      - name: Compile minimal consumer example
        run: |
          mvn ${MAVEN_ARGS} -f examples/minimal-spring-boot/pom.xml \
            compile

      - name: Build and install real apps suite
        run: |
          mvn ${MAVEN_ARGS} -f examples/real-apps/pom.xml \
            install

      - name: Smoke boot-test real apps (offline 'smoke' profile)
        run: .github/scripts/smoke-boot-realapps.sh

      - name: Smoke data-sync between ecommerce and chat runtime
        run: .github/scripts/smoke-ecommerce-chat-datasync.sh

  vector-provider-contracts:
    name: Vector Provider Container Contracts
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs:
      - provider-registry
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Verify Docker is available
        run: |
          docker --version
          docker info | head -5

      - name: Run vector provider container contracts
        run: .github/scripts/run-vector-container-contracts.sh
        env:
          MAVEN_OPTS: -Xmx2g

      - name: Upload vector contract reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vector-provider-contract-reports
          path: |
            ai-infrastructure-module/integration-Testing/vector-contract-tests/target/failsafe-reports/
            ai-infrastructure-module/integration-Testing/vector-contract-tests/target/surefire-reports/
          retention-days: 30
