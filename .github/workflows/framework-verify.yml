name: Framework Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  MAVEN_ARGS: -B -V --no-transfer-progress

jobs:
  provider-registry:
    name: Provider Registry
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install YAML parser
        run: python3 -m pip install --disable-pip-version-check --quiet pyyaml

      - name: Validate provider registry and workflow choices
        run: .github/scripts/validate-provider-registry.sh

  maven-build:
    name: Maven Build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs:
      - provider-registry
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Verify Docker is available
        run: |
          docker --version
          docker info | head -5

      - name: Build, test, and install framework reactor
        run: |
          mvn ${MAVEN_ARGS} -f ai-infrastructure-module/pom.xml \
            -Dai.vector-db.lucene.cleanup-on-close=true \
            install
        env:
          MAVEN_OPTS: -Xmx2g

      - name: Compile minimal consumer example
        run: |
          mvn ${MAVEN_ARGS} -f examples/minimal-spring-boot/pom.xml \
            -DskipTests \
            compile

      - name: Build and install real apps suite
        run: |
          mvn ${MAVEN_ARGS} -f examples/real-apps/pom.xml \
            -DskipTests \
            install

      - name: Smoke boot-test real apps (offline 'smoke' profile)
        run: .github/scripts/smoke-boot-realapps.sh
