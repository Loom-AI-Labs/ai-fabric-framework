name: AI Fabric Framework GitHub Packages Release

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      ref:
        description: Existing tag or ref to publish from, for example ai-fabric-framework-v0.1.0-preview.
        required: true

permissions:
  contents: write
  packages: write

env:
  MAVEN_ARGS: -B -V --no-transfer-progress
  FRAMEWORK_MODULES: >-
    .,
    ai-infrastructure-core,
    ai-infrastructure-actions-connector,
    ai-infrastructure-actions-registry,
    ai-infrastructure-actions-registry-liquibase,
    ai-infrastructure-retrieval-connector,
    ai-infrastructure-data-sync,
    ai-infrastructure-relay,
    ai-infrastructure-generic-rest-connector,
    ai-fabric-runtime,
    ai-infrastructure-indexing,
    ai-infrastructure-pii,
    ai-infrastructure-governance,
    ai-fabric-starter,
    ai-fabric-provider-starter,
    curated/ai-curated-default,
    curated/ai-curated-commerce,
    curated/ai-curated-support,
    ai-infrastructure-rag,
    ai-infrastructure-web,
    providers/ai-infrastructure-provider-openai,
    providers/ai-infrastructure-provider-azure,
    providers/ai-infrastructure-provider-cohere,
    providers/ai-infrastructure-provider-anthropic,
    providers/ai-infrastructure-provider-gemini,
    providers/ai-infrastructure-onnx-starter,
    ai-infrastructure-relationship-query,
    ai-infrastructure-chat-session,
    ai-infrastructure-behavior,
    victor-databases/ai-infrastructure-vector-lucene,
    victor-databases/ai-infrastructure-vector-pinecone,
    ai-infrastructure-migration,
    victor-databases/ai-infrastructure-vector-memory,
    victor-databases/ai-infrastructure-vector-weaviate,
    victor-databases/ai-infrastructure-vector-qdrant,
    victor-databases/ai-infrastructure-vector-milvus

jobs:
  publish-framework:
    name: Publish Framework Maven Packages
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'ai-fabric-framework-v')

    steps:
      - name: Checkout release ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.ref }}

      - name: Set up JDK 21 for GitHub Packages
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Resolve release metadata
        id: release
        shell: bash
        run: |
          set -euo pipefail

          version="$(mvn -q -f ai-infrastructure-module/pom.xml help:evaluate -Dexpression=project.version -DforceStdout)"
          ref="${{ github.event.release.tag_name || inputs.ref }}"
          expected_tag="ai-fabric-framework-v${version}"

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"
          echo "expected_tag=${expected_tag}" >> "$GITHUB_OUTPUT"

          if [[ "${ref}" == ai-fabric-framework-v* && "${ref}" != "${expected_tag}" ]]; then
            echo "Release ref '${ref}' does not match Maven version '${version}'. Expected '${expected_tag}'." >&2
            exit 1
          fi

      - name: Verify publishable framework reactor
        run: |
          mvn ${MAVEN_ARGS} -f ai-infrastructure-module/pom.xml \
            -pl "${FRAMEWORK_MODULES//[[:space:]]/}" \
            -am \
            -DskipITs \
            verify

      - name: Deploy Maven packages to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mvn ${MAVEN_ARGS} -f ai-infrastructure-module/pom.xml \
            -pl "${FRAMEWORK_MODULES//[[:space:]]/}" \
            -am \
            -DskipTests \
            deploy

      - name: Build framework-only source archive
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.release.outputs.version }}"
          archive="ai-fabric-framework-source-${version}.tar.gz"

          tar \
            --exclude='*/target' \
            --exclude='*/.git' \
            --exclude='*/.idea' \
            --exclude='*/.vscode' \
            -czf "${archive}" \
            ai-infrastructure-module \
            docs \
            examples \
            README.md \
            LICENSE \
            CONTRIBUTING.md \
            SECURITY.md \
            CODE_OF_CONDUCT.md

          sha256sum "${archive}" > "${archive}.sha256"

      - name: Upload framework source archive to GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${{ steps.release.outputs.version }}"
          archive="ai-fabric-framework-source-${version}.tar.gz"
          gh release upload "${{ github.event.release.tag_name }}" "${archive}" "${archive}.sha256" --clobber
