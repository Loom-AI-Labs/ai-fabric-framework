# Integration-profile tests intentionally override the default test beans (e.g. each use-case
# test supplies its own `vectorDatabaseService` via a @TestConfiguration that overrides the
# shared @ConditionalOnMissingBean default in RelationshipQueryIntegrationTestBeans). Allow that
# override deterministically, independent of configuration-class processing order.
spring.main.allow-bean-definition-overriding=true
