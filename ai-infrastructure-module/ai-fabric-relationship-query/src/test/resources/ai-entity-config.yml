ai-config:
  default-embedding-model: text-embedding-3-small
  default-search-limit: 10

ai-entities:
  document:
    features:
      - embedding
      - search
    searchable-fields:
      - name: title
        include-in-rag: true
    metadata-fields:
      - name: status
        type: string
        include-in-search: true
      - name: author.fullName
        type: string
        include-in-search: true

  product:
    features:
      - embedding
      - search
    searchable-fields:
      - name: name
        include-in-rag: true
      - name: color
        include-in-rag: true
      - name: price
        include-in-rag: true
    metadata-fields:
      - name: status
        type: string
        include-in-search: true
      - name: brand.name
        type: string
        include-in-search: true

  medical-case:
    features:
      - embedding
      - search
    searchable-fields:
      - name: title
        include-in-rag: true
    metadata-fields:
      - name: status
        type: string
        include-in-search: true
      - name: specialty
        type: string
        include-in-search: true
      - name: patient.fullName
        type: string
        include-in-search: true

  transaction:
    features:
      - embedding
      - search
    searchable-fields:
      - name: title
        include-in-rag: true
    metadata-fields:
      - name: channel
        type: string
        include-in-search: true
      - name: status
        type: string
        include-in-search: true

  candidate:
    features:
      - embedding
      - search
    searchable-fields:
      - name: fullName
        include-in-rag: true
      - name: location
        include-in-rag: true
      - name: primarySkill
        include-in-rag: true
    metadata-fields:
      - name: seniority
        type: string
        include-in-search: true
      - name: recruiter.fullName
        type: string
        include-in-search: true

