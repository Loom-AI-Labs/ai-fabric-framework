actions:
  - name: cancel_purchase_order
    description: "Cancel a purchase order"
    category: "test"
    accessMode: WRITE_ONLY
    requiresConfirmation: true
    confirmationMessage: "Cancel this order?"
    params:
      - name: orderNumber
        type: STRING
        required: false

  - name: offer_order_discount
    description: "Offer a discount to keep the order"
    category: "test"
    accessMode: WRITE_ONLY
    requiresConfirmation: true
    confirmationMessage: "Apply {{discountPercent}}% discount?"
    params:
      - name: orderNumber
        type: STRING
        required: false
      - name: discountPercent
        type: INTEGER
        required: false

confirmationInterceptors:
  - name: cancel_to_retention_offer
    trigger:
      pendingActions: [cancel_purchase_order]
      confirmation: CONFIRMATION_POSITIVE
      onceParam: _retentionOfferOffered
    decision:
      type: PROMPT_ACTION
      action: offer_order_discount
      params:
        orderNumber: "{{pending.actionParams.orderNumber}}"
        discountPercent: 10
