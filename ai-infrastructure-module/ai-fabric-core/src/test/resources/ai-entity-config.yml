ai-config:
  default-embedding-model: text-embedding-3-small
  default-search-limit: 10
ai-entities:
  document:
    indexing:
      enabled: true
    searchable-fields:
    - name: title
      destinations:
      - SEMANTIC_SEARCH
      - RAG_CONTEXT
      preprocessing: NORMALIZE
      priority: 50
  product:
    indexing:
      enabled: true
    searchable-fields:
    - name: name
      destinations:
      - SEMANTIC_SEARCH
      - RAG_CONTEXT
      preprocessing: NORMALIZE
      priority: 50
  transaction:
    indexing:
      enabled: true
    searchable-fields:
    - name: title
      destinations:
      - SEMANTIC_SEARCH
      - RAG_CONTEXT
      preprocessing: NORMALIZE
      priority: 50
