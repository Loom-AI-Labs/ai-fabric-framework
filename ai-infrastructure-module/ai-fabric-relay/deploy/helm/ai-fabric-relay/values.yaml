replicaCount: 2

image:
  repository: ai-fabric-relay
  tag: "0.2.1"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8081

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 0
  fsGroup: 0

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

resources: {}

springApplicationJson:
  server:
    port: 8081
  relay:
    auth:
      allowUnauthenticated: false
      apiKey:
        enabled: true
        header: X-AIFABRIC-API-KEY
        value: change-me
      hmac:
        enabled: false
    store:
      backend: IN_MEMORY
    routing:
      mode: DISPATCHER
      dispatcher:
        url: http://internal-dispatcher.default.svc.cluster.local:8080/actions/execute
      retrieval:
        url: http://internal-dispatcher.default.svc.cluster.local:8080/retrieval/search

extraEnv: []

nodeSelector: {}
tolerations: []
affinity: {}
