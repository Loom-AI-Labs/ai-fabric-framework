spring:
  main:
    allow-bean-definition-overriding: true
  datasource:
    url: jdbc:h2:mem:behavior_it;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driverClassName: org.h2.Driver
    username: sa
    password: sa
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false

ai:
  behavior:
    enabled: true
    mode: FULL
  providers:
    enabled: true
    # Support dynamic provider selection via system properties or environment variables
    # Priority: System property > Environment variable > Default (onnx)
    llm-provider: ${AI_INFRASTRUCTURE_LLM_PROVIDER:${LLM_PROVIDER:openai}}
    embedding-provider: ${AI_INFRASTRUCTURE_EMBEDDING_PROVIDER:${EMBEDDING_PROVIDER:onnx}}
    enable-fallback: false

    # OpenAI configuration - enable when selected as provider
    # Default to false to avoid initialization errors when API key is not set
    # Scripts will explicitly set OPENAI_ENABLED=true when OpenAI is selected
    openai:
      enabled: ${OPENAI_ENABLED:${AI_INFRASTRUCTURE_OPENAI_ENABLED:false}}
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
      model: ${OPENAI_MODEL:${LLM_MODEL:gpt-4o-mini}}
      embedding-model: ${OPENAI_EMBEDDING_MODEL:${EMBEDDING_MODEL:text-embedding-3-small}}
      max-tokens: 2000
      temperature: 0.0
      timeout: 30
      priority: 100

    anthropic:
      enabled: ${ANTHROPIC_ENABLED:false}
      api-key: ${ANTHROPIC_API_KEY:}
      base-url: ${ANTHROPIC_BASE_URL:https://api.anthropic.com}
      model: ${ANTHROPIC_MODEL:${LLM_MODEL:claude-3-haiku-20240307}}
      embedding-model: ${ANTHROPIC_EMBEDDING_MODEL:${EMBEDDING_MODEL:}}
      max-tokens: 4096
      temperature: 0.3
      timeout: 60
      priority: 95

    gemini:
      enabled: ${GEMINI_ENABLED:false}
      api-key: ${GEMINI_API_KEY:}
      base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
      model: ${GEMINI_MODEL:${LLM_MODEL:gemini-2.5-flash}}
      embedding-model: ${GEMINI_EMBEDDING_MODEL:${EMBEDDING_MODEL:text-embedding-004}}
      max-tokens: 4096
      temperature: 0.3
      timeout: 60
      priority: 90

    cohere:
      enabled: ${COHERE_ENABLED:false}
      api-key: ${COHERE_API_KEY:}
      base-url: ${COHERE_BASE_URL:https://api.cohere.ai/v1}
      model: ${COHERE_MODEL:${LLM_MODEL:command-r7b-12-2024}}
      embedding-model: ${COHERE_EMBEDDING_MODEL:${EMBEDDING_MODEL:embed-english-v3.0}}
      max-tokens: 4096
      temperature: 0.3
      timeout: 60
      priority: 85

    azure:
      enabled: ${AZURE_ENABLED:false}
      api-key: ${AZURE_API_KEY:}
      endpoint: ${AZURE_ENDPOINT:}
      deployment-name: ${AZURE_DEPLOYMENT_NAME:}
      embedding-deployment-name: ${AZURE_EMBEDDING_DEPLOYMENT_NAME:}
      api-version: ${AZURE_API_VERSION:2024-02-15-preview}
      timeout: 60
      priority: 80

    # Keep ONNX configured so embedding-provider=onnx is valid.
    onnx:
      enabled: true
      model-path: ${ONNX_MODEL_PATH:classpath:/models/embeddings/all-MiniLM-L6-v2.onnx}
      tokenizer-path: ${ONNX_TOKENIZER_PATH:classpath:/models/embeddings/tokenizer.json}
      max-sequence-length: 512
      use-gpu: false
      model-alias: all-MiniLM-L6-v2

# keep logging quiet in CI
logging:
  level:
    root: INFO
    org.springframework: INFO
    ai.fabric: INFO
