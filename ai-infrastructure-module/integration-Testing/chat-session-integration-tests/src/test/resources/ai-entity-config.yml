ai-config:
  default-embedding-model: text-embedding-3-small
  default-search-limit: 10
ai-entities:
  ragconversation:
    indexing:
      enabled: true
    searchable-fields:
    - name: name
      destinations:
      - SEMANTIC_SEARCH
      - RAG_CONTEXT
      preprocessing: NORMALIZE
      priority: 50
    - name: description
      destinations:
      - SEMANTIC_SEARCH
      - RAG_CONTEXT
      preprocessing: NORMALIZE
      priority: 50
