ai-config:
  default-embedding-model: text-embedding-3-small
  default-search-limit: 10

ai-entities:
  document:
    features:
      - embedding
      - search
    searchable-fields:
      - name: title
        include-in-rag: true
    metadata-fields:
      - name: status
        type: string
        include-in-search: true
      - name: author.fullName
        type: string
        include-in-search: true
  product:
    features:
      - embedding
      - search
    searchable-fields:
      - name: name
        include-in-rag: true
      - name: color
        include-in-rag: true
      - name: price
        include-in-rag: true
    metadata-fields:
      - name: brand.name
        type: string
        include-in-search: true
      - name: status
        type: string
        include-in-search: true
  transaction:
    features:
      - embedding
      - search
    searchable-fields:
      - name: title
        include-in-rag: true
    metadata-fields:
      - name: channel
        type: string
        include-in-search: true
      - name: status
        type: string
        include-in-search: true
      - name: sourceAccount.region
        type: string
        include-in-search: true
      - name: destinationAccount.region
        type: string
        include-in-search: true
