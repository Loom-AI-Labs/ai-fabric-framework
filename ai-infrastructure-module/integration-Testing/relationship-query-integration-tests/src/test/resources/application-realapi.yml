# Real API Test Configuration - Relationship Query Integration Tests
#
# This configuration supports flexible provider combinations via environment variables:
#
# LLM Provider:
#   AI_INFRASTRUCTURE_LLM_PROVIDER or LLM_PROVIDER (default: openai)
#   Options: openai, anthropic, azure, ollama
#
# Embedding Provider:
#   AI_INFRASTRUCTURE_EMBEDDING_PROVIDER or EMBEDDING_PROVIDER (default: onnx)
#   Options: openai, onnx, azure
#
# Vector Database:
#   AI_INFRASTRUCTURE_VECTOR_DATABASE or VECTOR_DB (default: lucene)
#   Options: lucene, memory, pinecone, qdrant
#
# Usage Examples:
#   ./run-relationship-query-realapi-tests.sh "openai:onnx:lucene"
#   ./run-relationship-query-realapi-tests.sh "openai:onnx:memory"
#   ./run-relationship-query-realapi-tests.sh "anthropic:openai:pinecone"
#
# The script automatically sets AI_INFRASTRUCTURE_* environment variables based on
# the provider matrix specification. Provider credentials (e.g., OPENAI_API_KEY)
# must be supplied via environment variables or JVM -D properties.
#
spring:
  datasource:
    url: jdbc:h2:mem:relationship_query_realapi;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: false
    show-sql: false
  main:
    allow-bean-definition-overriding: true

ai:
  curated:
    pack: ${AI_CURATED_PACK:}

  providers:
    llm-provider: ${AI_INFRASTRUCTURE_LLM_PROVIDER:${LLM_PROVIDER:openai}}
    embedding-provider: ${AI_INFRASTRUCTURE_EMBEDDING_PROVIDER:${EMBEDDING_PROVIDER:onnx}}
    enable-fallback: ${AI_INFRASTRUCTURE_ENABLE_FALLBACK:false}

    onnx:
      enabled: true
      model-path: ${ONNX_MODEL_PATH:classpath:/models/embeddings/all-MiniLM-L6-v2.onnx}
      tokenizer-path: ${ONNX_TOKENIZER_PATH:classpath:/models/embeddings/tokenizer.json}
      max-sequence-length: 512
      use-gpu: false
      model-alias: all-MiniLM-L6-v2

    openai:
      enabled: ${OPENAI_ENABLED:${AI_INFRASTRUCTURE_OPENAI_ENABLED:false}}
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
      model: ${OPENAI_MODEL:${LLM_MODEL:gpt-4o-mini}}
      embedding-model: ${OPENAI_EMBEDDING_MODEL:${EMBEDDING_MODEL:text-embedding-3-small}}
      max-tokens: 2000
      temperature: 0.0
      timeout: 30
      priority: 100

    anthropic:
      enabled: ${ANTHROPIC_ENABLED:${AI_INFRASTRUCTURE_ANTHROPIC_ENABLED:false}}
      api-key: ${ANTHROPIC_API_KEY:}
      base-url: ${ANTHROPIC_BASE_URL:https://api.anthropic.com}
      model: ${ANTHROPIC_MODEL:${LLM_MODEL:claude-3-haiku-20240307}}
      embedding-model: ${ANTHROPIC_EMBEDDING_MODEL:${EMBEDDING_MODEL:}}
      max-tokens: 4096
      temperature: 0.3
      timeout: 60
      priority: 95

    gemini:
      enabled: ${GEMINI_ENABLED:${AI_INFRASTRUCTURE_GEMINI_ENABLED:false}}
      api-key: ${GEMINI_API_KEY:}
      base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
      model: ${GEMINI_MODEL:${LLM_MODEL:gemini-2.5-flash}}
      embedding-model: ${GEMINI_EMBEDDING_MODEL:${EMBEDDING_MODEL:text-embedding-004}}
      max-tokens: 4096
      temperature: 0.3
      timeout: 60
      priority: 90

    cohere:
      enabled: ${COHERE_ENABLED:${AI_INFRASTRUCTURE_COHERE_ENABLED:false}}
      api-key: ${COHERE_API_KEY:}
      base-url: ${COHERE_BASE_URL:https://api.cohere.ai/v1}
      model: ${COHERE_MODEL:${LLM_MODEL:command-r7b-12-2024}}
      embedding-model: ${COHERE_EMBEDDING_MODEL:${EMBEDDING_MODEL:embed-english-v3.0}}
      max-tokens: 4096
      temperature: 0.3
      timeout: 60
      priority: 85

    azure:
      enabled: ${AZURE_ENABLED:false}
      api-key: ${AZURE_API_KEY:}
      endpoint: ${AZURE_ENDPOINT:}
      deployment-name: ${AZURE_DEPLOYMENT_NAME:}
      embedding-deployment-name: ${AZURE_EMBEDDING_DEPLOYMENT_NAME:}
      api-version: ${AZURE_API_VERSION:2024-02-15-preview}
      timeout: 60
      priority: 80

  vector-db:
    type: ${AI_INFRASTRUCTURE_VECTOR_DATABASE:${VECTOR_DB:lucene}}
    lucene:
      index-path: ${AI_LUCENE_INDEX_PATH:${java.io.tmpdir}/relationship-query-realapi-lucene}
      vector-dimension: 384
      similarity-threshold: 0.6
      max-results: 100
      create-index-if-not-exists: true
    memory:
      enabled: true
      similarity-threshold: 0.6
      max-results: 100
    pinecone:
      api-key: ${PINECONE_API_KEY:}
      environment: ${PINECONE_ENVIRONMENT:}
      index-name: ${PINECONE_INDEX_NAME:relationship-query-test}
      dimensions: ${PINECONE_DIMENSIONS:384}
      metric: cosine
    # Vector database providers (enabled by Testcontainers when testcontainers profile is active)
    # These properties are injected by TestcontainersInitializer before Spring context initialization
    qdrant:
      enabled: true  # Will be overridden by Testcontainers if container is started
      host: ${ai.providers.qdrant.host:localhost}
      port: ${ai.providers.qdrant.port:6333}
      grpc-port: ${ai.providers.qdrant.grpc-port:6334}
      api-key: ${ai.providers.qdrant.api-key:}
      prefer-grpc: ${ai.providers.qdrant.prefer-grpc:false}
    milvus:
      enabled: true  # Will be overridden by Testcontainers if container is started
      host: ${ai.providers.milvus.host:localhost}
      port: ${ai.providers.milvus.port:19530}
      database-name: ${ai.providers.milvus.database-name:default}
      username: ${ai.providers.milvus.username:}
      password: ${ai.providers.milvus.password:}
      secure: ${ai.providers.milvus.secure:false}
    weaviate:
      enabled: true  # Will be overridden by Testcontainers if container is started
      scheme: ${ai.providers.weaviate.scheme:http}
      host: ${ai.providers.weaviate.host:localhost}
      port: ${ai.providers.weaviate.port:8080}
      api-key: ${ai.providers.weaviate.api-key:}
  infrastructure:
    relationship:
      schema:
        auto-discover: false
        refresh-on-startup: true
        include-fields: true
      fallback-to-metadata: false
      fallback-to-vector-search: false
      fallback-to-simple-search: false
      max-traversal-depth: 3
      enable-query-validation: true
      planner:
        log-plans: true
        fail-on-parse-error: true
        max-retries: 1

logging:
  level:
    ai.fabric.relationship: INFO
