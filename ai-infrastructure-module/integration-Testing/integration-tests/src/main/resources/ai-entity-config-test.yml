      - SEMANTIC_SEARCH
      - RAG_CONTEXT
      preprocessing: NORMALIZE
      priority: 66
    - name: lastName
      destinations:
      - SEMANTIC_SEARCH
      - RAG_CONTEXT
      preprocessing: NORMALIZE
      priority: 66
    - name: email
      destinations:
      - SEMANTIC_SEARCH
      - RAG_CONTEXT
      preprocessing: NORMALIZE
      priority: 62
    - name: bio
      destinations:
      - SEMANTIC_SEARCH
      - RAG_CONTEXT
      preprocessing: NORMALIZE
      priority: 70
    metadata-fields:
    - name: email
      data-type: STRING
      destinations:
      - VECTOR_METADATA
      - API_RESPONSE
    - name: age
      data-type: NUMBER
      destinations:
      - API_RESPONSE
    - name: location
      data-type: STRING
      destinations:
      - VECTOR_METADATA
      - API_RESPONSE
  test-article:
    indexing:
      enabled: true
    searchable-fields:
