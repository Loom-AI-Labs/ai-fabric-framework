ai-config:
  default-embedding-model: text-embedding-3-small
  default-search-limit: 10
  default-similarity-threshold: 0.7
ai-entities:
  test-product:
    indexing:
      enabled: true
    searchable-fields:
    - name: name
      destinations:
      - SEMANTIC_SEARCH
      - RAG_CONTEXT
      preprocessing: NORMALIZE
      priority: 70
    - name: description
      destinations:
      - SEMANTIC_SEARCH
      - RAG_CONTEXT
      preprocessing: NORMALIZE
      priority: 66
    - name: category
      destinations:
      - SEMANTIC_SEARCH
      - RAG_CONTEXT
      preprocessing: NORMALIZE
      priority: 62
    metadata-fields:
    - name: category
      data-type: STRING
      destinations:
      - VECTOR_METADATA
      - API_RESPONSE
    - name: price
      data-type: NUMBER
      destinations:
      - API_RESPONSE
    - name: brand
      data-type: STRING
      destinations:
      - VECTOR_METADATA
      - API_RESPONSE
  product:
    indexing:
      enabled: true
    searchable-fields:
    - name: name
      destinations:
      - SEMANTIC_SEARCH
      - RAG_CONTEXT
      preprocessing: NORMALIZE
      priority: 70
    - name: description
      destinations:
