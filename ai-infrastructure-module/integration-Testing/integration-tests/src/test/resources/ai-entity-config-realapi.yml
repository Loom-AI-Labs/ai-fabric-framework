ai-config:
  default-embedding-model: text-embedding-3-small
  default-search-limit: 10
ai-entities:
  product:
    indexing:
      enabled: true
    searchable-fields:
    - name: name
      destinations:
      - SEMANTIC_SEARCH
      - RAG_CONTEXT
      preprocessing: NORMALIZE
      priority: 50
    - name: description
      destinations:
      - SEMANTIC_SEARCH
      - RAG_CONTEXT
      preprocessing: NORMALIZE
      priority: 50
  test-product:
    indexing:
      enabled: true
    searchable-fields:
    - name: name
      destinations:
      - SEMANTIC_SEARCH
      - RAG_CONTEXT
      preprocessing: NORMALIZE
      priority: 50
    - name: description
      destinations:
      - SEMANTIC_SEARCH
      - RAG_CONTEXT
      preprocessing: NORMALIZE
      priority: 50
    - name: category
      destinations:
      - SEMANTIC_SEARCH
      - RAG_CONTEXT
      preprocessing: NORMALIZE
      priority: 50
    - name: brand
      destinations:
      - SEMANTIC_SEARCH
      - RAG_CONTEXT
      preprocessing: NORMALIZE
      priority: 50
    metadata-fields:
    - name: category
      data-type: STRING
      destinations:
      - VECTOR_METADATA
      - API_RESPONSE
    - name: brand
      data-type: STRING
      destinations:
      - VECTOR_METADATA
      - API_RESPONSE
    - name: price
      data-type: NUMBER
      destinations:
      - VECTOR_METADATA
      - API_RESPONSE
  test-article:
    indexing:
      enabled: true
    searchable-fields:
    - name: title
      destinations:
      - SEMANTIC_SEARCH
      - RAG_CONTEXT
      preprocessing: NORMALIZE
      priority: 50
    - name: content
      destinations:
      - SEMANTIC_SEARCH
      - RAG_CONTEXT
      preprocessing: NORMALIZE
      priority: 50
    metadata-fields:
    - name: author
      data-type: STRING
      destinations:
      - VECTOR_METADATA
      - API_RESPONSE
    - name: publishDate
      data-type: DATE
      destinations:
      - VECTOR_METADATA
      - API_RESPONSE
    - name: published
      data-type: BOOLEAN
      destinations:
      - VECTOR_METADATA
      - API_RESPONSE
  test-user:
    indexing:
      enabled: true
    searchable-fields:
    - name: displayName
      destinations:
      - SEMANTIC_SEARCH
      - RAG_CONTEXT
      preprocessing: NORMALIZE
      priority: 50
    - name: bio
      destinations:
      - SEMANTIC_SEARCH
      - RAG_CONTEXT
      preprocessing: NORMALIZE
      priority: 50
    - name: firstName
      destinations:
      - SEMANTIC_SEARCH
      - RAG_CONTEXT
      preprocessing: NORMALIZE
      priority: 50
    - name: lastName
      destinations:
      - SEMANTIC_SEARCH
      - RAG_CONTEXT
      preprocessing: NORMALIZE
      priority: 50
    - name: email
      destinations:
      - SEMANTIC_SEARCH
      - RAG_CONTEXT
      preprocessing: NORMALIZE
      priority: 50
    metadata-fields:
    - name: email
      data-type: STRING
      destinations:
      - VECTOR_METADATA
      - API_RESPONSE
    - name: age
      data-type: NUMBER
      destinations:
      - VECTOR_METADATA
      - API_RESPONSE
    - name: location
      data-type: STRING
      destinations:
      - VECTOR_METADATA
      - API_RESPONSE
