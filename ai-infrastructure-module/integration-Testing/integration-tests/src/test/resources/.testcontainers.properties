# Testcontainers configuration for Windows Docker Desktop
# This file helps Testcontainers connect to Docker Desktop on Windows

# Force Docker API version to be compatible with Docker Desktop 29.x
# Docker Desktop 29.1.3 supports API 1.44+, but Testcontainers 1.19.3 may need explicit version
docker.client.version=1.44

# Docker host configuration for Windows
# Use docker_engine pipe instead of docker_cli for better compatibility
# This is the standard named pipe for Docker Desktop on Windows
docker.host=npipe:////./pipe/docker_engine

# Timeout for Docker operations (in seconds)
docker.client.timeout=120

# Enable Ryuk (container cleanup) - this is enabled by default
# ryuk.container.image=testcontainers/ryuk:0.5.1

# Disable Ryuk if you're having issues (not recommended for CI/CD)
# ryuk.container.enabled=false
