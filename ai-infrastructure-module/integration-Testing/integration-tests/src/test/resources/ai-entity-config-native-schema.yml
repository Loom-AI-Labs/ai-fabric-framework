ai-config:
  default-embedding-model: text-embedding-3-small
  default-search-limit: 10
ai-entities:
  test-article:
    indexing:
      enabled: true
    searchable-fields:
      - name: title
        destinations:
          - SEMANTIC_SEARCH
          - RAG_CONTEXT
        preprocessing: NORMALIZE
        priority: 50
      - name: content
        destinations:
          - SEMANTIC_SEARCH
          - RAG_CONTEXT
        preprocessing: NORMALIZE
        priority: 50
