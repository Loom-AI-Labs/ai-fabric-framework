# Testcontainers Profile Configuration
# Activated with: -Dspring.profiles.active=testcontainers
#
# This profile enables automatic Testcontainers-based vector database setup
# for integration tests. Containers are started automatically and connection
# properties are injected into the Spring environment.

testcontainers:
  enabled: true

spring:
  autoconfigure:
    exclude:
      - org.springframework.ai.model.google.genai.autoconfigure.chat.GoogleGenAiChatAutoConfiguration
      - org.springframework.ai.model.google.genai.autoconfigure.embedding.GoogleGenAiEmbeddingConnectionAutoConfiguration
      - org.springframework.ai.model.google.genai.autoconfigure.embedding.GoogleGenAiTextEmbeddingAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiChatAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration
      - org.springframework.ai.model.anthropic.autoconfigure.AnthropicChatAutoConfiguration
  ai:
    model:
      chat: none
      embedding: none
      embedding.text: none

# Vector database type - defaults to lucene if not specified
# To use Testcontainers with a shipped AI Fabric vector provider module, specify:
# -Dai.vector-db.type=milvus, qdrant, or weaviate
# Chroma and pgvector entries below are generic future-provider fixtures only.
# If not specified or set to lucene/memory, Testcontainers will not activate
ai:
  providers:
    # Enable vector provider configuration blocks for integration tests.
    # Chroma/pgvector do not currently have AI Fabric vector provider modules.
    milvus:
      enabled: true
    qdrant:
      enabled: true
    weaviate:
      enabled: true
    chroma:
      enabled: true
    pgvector:
      enabled: true

  vector-db:
    type: ${VECTOR_DB_TYPE:lucene}
    lucene:
      index-path: ./data/test-lucene-index
      similarity-threshold: 0.7
      max-results: 100

    # Timeouts adjusted for container startup
    milvus:
      timeout: 60000
    qdrant:
      timeout: 60000
    weaviate:
      timeout: 60000
    chroma:
      timeout: 60000
    pgvector:
      timeout: 60000

# Logging for Testcontainers
logging:
  level:
    org.testcontainers: INFO
    com.github.dockerjava: WARN
    ai.fabric.it.config: DEBUG
