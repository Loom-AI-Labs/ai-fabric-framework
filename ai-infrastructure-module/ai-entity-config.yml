ai-config:
  default-embedding-model: text-embedding-3-small
  default-search-limit: 10
ai-entities:
  ai_profile:
    indexing:
      enabled: true
  behavior:
    indexing:
      enabled: true
  behavior-insight:
    indexing:
      enabled: true
    analysis:
      enabled: true
      after:
      - CREATE
      - UPDATE
    searchable-fields:
    - name: segment
      destinations:
      - SEMANTIC_SEARCH
      - RAG_CONTEXT
      preprocessing: NORMALIZE
      priority: 70
    - name: patterns
      destinations:
      - SEMANTIC_SEARCH
      - RAG_CONTEXT
      preprocessing: NORMALIZE
      priority: 70
  product:
    indexing:
      enabled: true
  order:
    indexing:
      enabled: true
  user:
    indexing:
      enabled: true
