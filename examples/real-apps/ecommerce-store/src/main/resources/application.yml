server:
  port: ${PORT:8096}
  forward-headers-strategy: framework

spring:
  application:
    name: ecommerce-store
  datasource:
    url: jdbc:h2:file:./data/ecommerce-store.db
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.ai.fabric.realapps.chat: INFO

app:
  admin:
    enabled: ${APP_ADMIN_AUTH_ENABLED:${CONNECTOR_ADMIN_AUTH_ENABLED:true}}
    api-key: ${APP_ADMIN_API_KEY:${CONNECTOR_ADMIN_API_KEY:}}
    api-key-header: ${APP_ADMIN_API_KEY_HEADER:${CONNECTOR_ADMIN_API_KEY_HEADER:X-ADMIN-API-KEY}}
  demo:
    seed-data: ${APP_DEMO_SEED_DATA:true}
  cors:
    # Example: CORS_ALLOWED_ORIGINS=https://ai-fabric.dev
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
    # Example: CORS_ALLOWED_ORIGIN_PATTERNS=https://ai-fabric.dev,https://*.lovable.app
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:}
    # Example: CORS_ALLOW_CREDENTIALS=true (only if you need cookies/session auth from the browser)
    allow-credentials: ${CORS_ALLOW_CREDENTIALS:false}

connector:
  admin:
    auth:
      enabled: ${CONNECTOR_ADMIN_AUTH_ENABLED:${APP_ADMIN_AUTH_ENABLED:true}}
      api-key: ${CONNECTOR_ADMIN_API_KEY:${APP_ADMIN_API_KEY:}}
      api-key-header: ${CONNECTOR_ADMIN_API_KEY_HEADER:${APP_ADMIN_API_KEY_HEADER:X-AIFABRIC-API-KEY}}
  indexing:
    enabled: ${CONNECTOR_INDEXING_ENABLED:false}
    # Should point at the Generic REST Connector (which may proxy to runtime).
    runtime-base-url: ${CONNECTOR_INDEXING_RUNTIME_BASE_URL:http://rest-connector:8082}
    api-key: ${CONNECTOR_INDEXING_API_KEY:}
    api-key-header: ${CONNECTOR_INDEXING_API_KEY_HEADER:X-AIFABRIC-API-KEY}
