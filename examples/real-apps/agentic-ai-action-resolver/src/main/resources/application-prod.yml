spring:
  application:
    name: agentic-ai-action-resolver

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/agenticresolverdb}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

ai:
  execution:
    enabled: true
    capabilities:
      registered-vector-spaces:
        - account-resolution-policy
      allowed-actions:
        - get_account_profile
        - assess_billing_resolution
        - update_address
        - request_refund
    async:
      repository: ${AI_EXECUTION_ASYNC_REPOSITORY:JDBC}
      initialize-schema: ${AI_EXECUTION_ASYNC_INITIALIZE_SCHEMA:true}
      core-pool-size: ${AI_EXECUTION_CORE_POOL_SIZE:2}
      max-pool-size: ${AI_EXECUTION_MAX_POOL_SIZE:4}
      queue-capacity: ${AI_EXECUTION_QUEUE_CAPACITY:24}
      result-ttl: ${AI_EXECUTION_RESULT_TTL:PT15M}
      lease-duration: ${AI_EXECUTION_ASYNC_LEASE_DURATION:PT2M}
      recovery-interval: ${AI_EXECUTION_ASYNC_RECOVERY_INTERVAL:PT30S}
      recovery-batch-size: ${AI_EXECUTION_ASYNC_RECOVERY_BATCH_SIZE:50}
      max-attempts: ${AI_EXECUTION_ASYNC_MAX_ATTEMPTS:3}
      cleanup-enabled: ${AI_EXECUTION_ASYNC_CLEANUP_ENABLED:true}
      retention: ${AI_EXECUTION_ASYNC_RETENTION:P30D}
      encryption-secret: ${AI_EXECUTION_ASYNC_ENCRYPTION_SECRET:${ai.execution.receipts.encryption-secret:}}
      fingerprint-secret: ${AI_EXECUTION_ASYNC_FINGERPRINT_SECRET:${ai.execution.receipts.fingerprint-secret:}}
    receipts:
      enabled: true
      repository: JDBC
      initialize-schema: ${AI_EXECUTION_RECEIPT_INITIALIZE_SCHEMA:true}
      ttl: ${AI_EXECUTION_RECEIPT_TTL:P7D}
      stale-executing-after: ${AI_EXECUTION_STALE_EXECUTION:PT2M}
      recovery-interval: ${AI_EXECUTION_RECOVERY_INTERVAL:PT1M}
      recovery-batch-size: ${AI_EXECUTION_RECOVERY_BATCH_SIZE:100}
      cleanup-enabled: ${AI_EXECUTION_RECEIPT_CLEANUP_ENABLED:true}
      retention: ${AI_EXECUTION_RECEIPT_RETENTION:P30D}
      encryption-secret: ${AI_EXECUTION_RECEIPT_ENCRYPTION_SECRET:}
      fingerprint-secret: ${AI_EXECUTION_RECEIPT_FINGERPRINT_SECRET:}
    reviews:
      enabled: ${AI_EXECUTION_REVIEWS_ENABLED:true}
      repository: JDBC
      initialize-schema: ${AI_EXECUTION_REVIEW_INITIALIZE_SCHEMA:true}
      decision-lease-duration: ${AI_EXECUTION_REVIEW_DECISION_LEASE:PT2M}
      recovery-interval: ${AI_EXECUTION_REVIEW_RECOVERY_INTERVAL:PT30S}
      recovery-batch-size: ${AI_EXECUTION_REVIEW_RECOVERY_BATCH_SIZE:50}
      max-dispatch-attempts: ${AI_EXECUTION_REVIEW_MAX_DISPATCH_ATTEMPTS:3}
      max-decision-attempts: ${AI_EXECUTION_REVIEW_MAX_ATTEMPTS:3}
      cleanup-enabled: ${AI_EXECUTION_REVIEW_CLEANUP_ENABLED:true}
      retention: ${AI_EXECUTION_REVIEW_RETENTION:P90D}
      encryption-secret: ${AI_EXECUTION_REVIEW_ENCRYPTION_SECRET:}
      fingerprint-secret: ${AI_EXECUTION_REVIEW_FINGERPRINT_SECRET:}

  chat:
    enabled: true
    auto-create-sessions: true
    window-size: 8
    max-context-chars: 4000
    pinned-target-reuse-window-turns: 3

  prompts:
    bundle:
      overlays:
        - v1-account-resolver

  providers:
    llm-provider: openai
    embedding-provider: simple

    openai:
      enabled: ${OPENAI_ENABLED:true}
      model: ${OPENAI_MODEL:gpt-4o-mini}
      api-key: ${OPENAI_API_KEY:}
      base-url: https://api.openai.com/v1

  vector-db:
    type: ${AI_VECTOR_DB_TYPE:lucene}
    lucene:
      index-path: ${VECTOR_INDEX_PATH:./data/agentic-lucene-vector-index}

  orchestration:
    action-param-provenance-mode: WARN
    default-mode: resolver
    strict-mode-routing: true
    modes:
      resolver:
        actions-enabled: true
        actions-preferred: true
        retrieval-enabled: true
        retrieval-allowlist-required: true
        vector-space-selection-required: false
        information-mode: DETERMINISTIC_RAG_GENERATE
        expose-read-probe-fallback-attempt: true
        force-grounding-eligible-read-action-post-generation: true
        rag:
          fanout-enabled: true
          max-spaces: 2
          top-k-per-space: 3
          similarity-threshold: 0.45
          max-documents-returned-to-client: 4
          max-documents-used-for-context: 4
          max-context-chars: 3000
          retrieval-vector-spaces-allowlist:
            - account-resolution-policy
            - subscription-plan
        read-action-resolution:
          enabled: true
          planning-mode: ITERATIVE
          require-allowlist: true
          allowed-read-actions:
            - get_account_profile
            - assess_billing_resolution
          max-iterations: 2
          max-actions-per-iteration: 1
          max-total-actions: 2
          max-parallel-actions: 1
          max-planner-context-chars: 3000
          max-action-evidence-chars-per-action: 1800
          rag-cooperation-mode: PARALLEL_ACTIONS_AND_RAG
          require-grounding-eligible: true

  behavior:
    enabled: true
    mode: LIGHT

  pii-detection:
    enabled: true
    mode: DETECT_ONLY

server:
  port: ${PORT:8080}
  error:
    include-message: always
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.ai.fabric.realapps.agenticresolver: INFO
    ai.fabric: WARN
    org.springframework: WARN
    root: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

app:
  agentic-resolver:
    sessions:
      ttl: ${APP_AGENTIC_SESSION_TTL:PT6H}
      max-active: ${APP_AGENTIC_MAX_SESSIONS:500}
      cleanup-cron: ${APP_AGENTIC_SESSION_CLEANUP_CRON:0 */15 * * * *}
    reviews:
      reviewer-api-key: ${APP_REVIEWER_API_KEY:}
      senior-reviewer-api-key: ${APP_SENIOR_REVIEWER_API_KEY:}
  demo:
    cleanup:
      enabled: ${APP_DEMO_CLEANUP_ENABLED:true}
      ttl: ${APP_DEMO_CLEANUP_TTL:PT6H}
      cron: ${APP_DEMO_CLEANUP_CRON:0 */30 * * * *}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:}
    allow-credentials: ${CORS_ALLOW_CREDENTIALS:false}
