ai:
  providers:
    llm-provider: account-resolver-smoke
  execution:
    manifests:
      locations:
        - classpath*:ai-specialists/*.yml
        - classpath*:ai-specialists/*.yaml
        - classpath*:ai-specialists/*.json
        - classpath*:ai-chains/*.yml
        - classpath*:ai-chains/*.yaml
        - classpath*:ai-chains/*.json
    async:
      encryption-secret: smoke-agentic-async-encryption-key-local-only-0001
      fingerprint-secret: smoke-agentic-async-fingerprint-key-local-only-0002
    receipts:
      # Deterministic local-only keys keep the explicit offline smoke profile
      # self-contained. Shared and production profiles have no key fallback.
      encryption-secret: smoke-agentic-receipt-encryption-key-local-only
      fingerprint-secret: smoke-agentic-receipt-fingerprint-key-local-only
    reviews:
      enabled: true
      repository: JDBC
      initialize-schema: true
      encryption-secret: smoke-agentic-review-encryption-key-local-only-0001
      fingerprint-secret: smoke-agentic-review-fingerprint-key-local-only-0002
    specialist-chains:
      enabled: true
      durable-enabled: true
      allow-ephemeral: false
      initialize-schema: true
      encryption-secret: smoke-account-chain-encryption-secret-local-only-0001
      fingerprint-secret: smoke-account-chain-fingerprint-secret-local-only-0002
  orchestration:
    modes:
      resolver:
        rag:
          similarity-threshold: 0.0
app:
  agentic-resolver:
    reviews:
      reviewer-api-key: smoke-regular-reviewer-key
      senior-reviewer-api-key: smoke-senior-reviewer-key
