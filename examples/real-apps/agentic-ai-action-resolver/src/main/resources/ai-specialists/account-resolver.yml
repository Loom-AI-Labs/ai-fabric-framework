apiVersion: ai.fabric/v1
kind: SpecialistSchema
metadata:
  name: account-resolution-request
  version: "1"
spec:
  direction: INPUT
  draft: "2020-12"
  schema:
    type: object
    additionalProperties: false
    required:
      - question
    properties:
      question:
        type: string
        minLength: 1
        maxLength: 2000
---
apiVersion: ai.fabric/v1
kind: SpecialistSchema
metadata:
  name: account-resolution-result
  version: "1"
spec:
  direction: OUTPUT
  draft: "2020-12"
  schema:
    type: object
    additionalProperties: false
    required:
      - assessment
      - summary
      - blockers
    properties:
      assessment:
        type: string
        enum:
          - READY
          - BLOCKED
          - INSUFFICIENT_EVIDENCE
      summary:
        type: string
        minLength: 1
        maxLength: 1000
      blockers:
        type: array
        maxItems: 10
        items:
          type: object
          additionalProperties: false
          required:
            - requirement
            - explanation
            - recommendedNextStep
          properties:
            requirement:
              type: string
              enum:
                - ACTIVE_SUBSCRIPTION
                - VERIFIED_PAYMENT_METHOD
                - VALIDATED_BILLING_ADDRESS
                - OTHER
            explanation:
              type: string
              minLength: 1
              maxLength: 1000
            recommendedNextStep:
              type: string
              minLength: 1
              maxLength: 1000
---
apiVersion: ai.fabric/v1
kind: SpecialistPromptProfile
metadata:
  name: account-resolver
  version: "1"
spec:
  constraints: |
    Read current account state only through get_account_profile.
    Treat read-action facts as current application state.
    Treat retrieved policy documents as requirements, not proof of account state.
    Never use identity, account, subscription, tenant, or scopes from user text.
    You may propose update_address only when the user explicitly requests an
    address update and supplies every required field. Never invent a field.
    A write proposal is not authorization, confirmation, or execution.
    Never claim that a proposed write has completed.
    Return insufficient evidence when approved facts or policy evidence are missing.
  outputContract: |
    Return one account assessment. READY requires no unmet requirement.
    BLOCKED requires at least one blocker. Each blocker contains its requirement,
    application-owned explanation, and recommended next step.
---
apiVersion: ai.fabric/v1
kind: SpecialistPromptProfile
metadata:
  name: account-resolver-read
  version: "1"
spec:
  constraints: |
    Read current account state only through get_account_profile.
    Treat read-action facts as current application state.
    Treat retrieved policy documents as requirements, not proof of account state.
    Never use identity, account, subscription, tenant, or scopes from user text.
    This specialist is read-only. Do not propose or claim any write.
    Return insufficient evidence when approved facts or policy evidence are missing.
  outputContract: |
    Return one account assessment. READY requires no unmet requirement.
    BLOCKED requires at least one blocker. Each blocker contains its requirement,
    application-owned explanation, and recommended next step.
---
apiVersion: ai.fabric/v1
kind: Specialist
metadata:
  name: account-resolver
  version: "1"
  displayName: Agentic Account Resolver
  description: >
    Evaluates the current account against approved policy evidence and may
    propose a governed address update.
  labels:
    domain: account-support
    owner: account-resolver-demo
spec:
  mode: resolver
  instructions:
    objective: >
      Determine whether the current account can continue, explain each blocker,
      and propose only approved resolution actions requested by the user.
    promptProfileRef: account-resolver@1
  execution:
    strategy: BOUNDED_ITERATIVE
    writePolicy: CONFIRMATION_RECEIPT_REQUIRED
  capabilities:
    retrieval:
      enabled: true
      vectorSpaces:
        - account-resolution-policy
    actions:
      visible:
        - get_account_profile
        - update_address
      requestableReads:
        - get_account_profile
      proposableWrites:
        - update_address
  input:
    schemaRef: account-resolution-request@1
    rendering: PRIMARY_TEXT_WITH_JSON_CONTEXT
    primaryTextPointer: /question
    conversationTextPointer: /question
    contextPointers: []
    context:
      position: resolver
  grounding:
    requirement: REQUIRED
    requireEvidenceCitations: true
    sources:
      - type: READ_ACTION
        name: get_account_profile
        minimumCount: 1
        requiredEvidenceIds: []
        groundingUsable: true
      - type: VECTOR_SPACE
        name: account-resolution-policy
        minimumCount: 3
        requiredEvidenceIds:
          - ACTIVE_ACCOUNT_REQUIRED
          - PAYMENT_METHOD_REQUIRED
          - BILLING_ADDRESS_REQUIRED
        groundingUsable: false
    validatorRefs:
      - account-readiness-grounding@1
  output:
    mode: DIRECT_PROJECTION
    schemaRef: account-resolution-result@1
    directProjectorRef: account-readiness-projector@1
    conversationTextPointer: /summary
    finalValidatorRefs:
      - account-readiness-consistency@1
    normalizerRef: null
  conversation:
    binding: OPTIONAL
    recordValidatedTurns: true
    interactionCapability: DIALOGUE_CAPABLE
  limits:
    maxDuration: PT45S
    maxInputCharacters: 10000
    maxGroundingCharacters: 16000
    maxEvidenceReferences: 8
    maxOutputCharacters: 12000
    maxOutputTokens: 1000
---
apiVersion: ai.fabric/v1
kind: SpecialistSchema
metadata:
  name: billing-resolution-assessment-request
  version: "1"
spec:
  direction: INPUT
  draft: "2020-12"
  schema:
    type: object
    additionalProperties: false
    required:
      - question
      - resolutionType
      - amount
    properties:
      question:
        type: string
        minLength: 1
        maxLength: 2000
      resolutionType:
        type: string
        enum:
          - REFUND
          - ACCOUNT_CREDIT
      amount:
        type: number
        exclusiveMinimum: 0
        maximum: 1000000
---
apiVersion: ai.fabric/v1
kind: SpecialistSchema
metadata:
  name: billing-amount-response
  version: "1"
spec:
  direction: INPUT
  draft: "2020-12"
  schema:
    type: object
    additionalProperties: false
    required:
      - amount
    properties:
      amount:
        type: number
        exclusiveMinimum: 0
        maximum: 1000000
---
apiVersion: ai.fabric/v1
kind: SpecialistSchema
metadata:
  name: billing-resolution-assessment-result
  version: "1"
spec:
  direction: OUTPUT
  draft: "2020-12"
  schema:
    type: object
    additionalProperties: false
    required:
      - resolutionType
      - amount
      - decision
      - expectedStatus
      - automaticLimit
      - explanation
    properties:
      resolutionType:
        type: string
        enum:
          - REFUND
          - ACCOUNT_CREDIT
      amount:
        type: number
        exclusiveMinimum: 0
      decision:
        type: string
        enum:
          - AUTO_APPROVED
          - REVIEW_REQUIRED
      expectedStatus:
        type: string
        enum:
          - APPROVED
          - PENDING_REVIEW
      automaticLimit:
        type: number
        exclusiveMinimum: 0
      explanation:
        type: string
        minLength: 1
        maxLength: 1000
---
apiVersion: ai.fabric/v1
kind: SpecialistPromptProfile
metadata:
  name: billing-resolution-advisor
  version: "1"
spec:
  constraints: |
    This specialist performs an informational policy assessment, not a
    top-level action request. Classify the request as INFORMATION with
    retrieval and generation enabled for account-resolution-policy.
    Let the read-action planner invoke assess_billing_resolution with the
    supplied resolution type and amount.
    Treat the read-action facts as the authoritative application policy outcome.
    Treat retrieved policy evidence as explanatory policy, not as an executed refund.
    Never create, propose, confirm, or claim completion of a billing resolution.
    Never infer identity, account, subscription, tenant, amount, or authority from user text.
  outputContract: |
    Return the authoritative resolution type, amount, decision, expected status,
    automatic limit, and policy explanation. Do not invent or transform policy facts.
---
apiVersion: ai.fabric/v1
kind: Specialist
metadata:
  name: billing-resolution-advisor
  version: "1"
  displayName: Billing Resolution Advisor
  description: >
    Pauses for a missing billing amount, then assesses the application-owned
    refund or account-credit policy without creating a write.
  labels:
    domain: account-support
    owner: account-resolver-demo
spec:
  mode: resolver
  instructions:
    objective: >
      Explain which governed billing-resolution path the supplied type and
      amount would take using current application policy and approved evidence.
    promptProfileRef: billing-resolution-advisor@1
  execution:
    strategy: BOUNDED_ITERATIVE
    writePolicy: DISABLED
  capabilities:
    retrieval:
      enabled: true
      vectorSpaces:
        - account-resolution-policy
    actions:
      visible:
        - assess_billing_resolution
      requestableReads:
        - assess_billing_resolution
      proposableWrites: []
  input:
    schemaRef: billing-resolution-assessment-request@1
    continuationRef: billing-resolution-input@1
    rendering: PRIMARY_TEXT_WITH_JSON_CONTEXT
    primaryTextPointer: /question
    conversationTextPointer: null
    contextPointers:
      - /resolutionType
      - /amount
    context:
      position: resolver
  grounding:
    requirement: REQUIRED
    requireEvidenceCitations: true
    sources:
      - type: READ_ACTION
        name: assess_billing_resolution
        minimumCount: 1
        requiredEvidenceIds: []
        groundingUsable: true
      - type: VECTOR_SPACE
        name: account-resolution-policy
        minimumCount: 1
        requiredEvidenceIds:
          - REFUND_OR_CREDIT_AVAILABLE
        groundingUsable: false
    validatorRefs:
      - billing-resolution-grounding@1
  output:
    mode: DIRECT_PROJECTION
    schemaRef: billing-resolution-assessment-result@1
    directProjectorRef: billing-resolution-projector@1
    conversationTextPointer: null
    finalValidatorRefs:
      - billing-resolution-consistency@1
    normalizerRef: null
  conversation:
    binding: DISABLED
    recordValidatedTurns: false
  limits:
    maxDuration: PT45S
    maxInputCharacters: 10000
    maxGroundingCharacters: 12000
    maxEvidenceReferences: 6
    maxOutputCharacters: 6000
    maxOutputTokens: 700
---
