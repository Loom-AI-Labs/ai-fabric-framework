spring:
  application:
    name: ai-fabric-account-resolver
  datasource:
    url: jdbc:h2:file:./data/subscriptiondb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: ${PORT:8081}

ai:
  config:
    default-file: ai-entity-config.yml

  providers:
    llm-provider: openai
    embedding-provider: simple

    openai:
      enabled: ${OPENAI_ENABLED:false}
      api-key: ${OPENAI_API_KEY:}
      base-url: https://api.openai.com/v1
      model: ${OPENAI_MODEL:gpt-4o-mini}

  vector-db:
    type: lucene

  behavior:
    enabled: false
    mode: LIGHT

  pii-detection:
    enabled: false
    mode: DETECT_ONLY

logging:
  level:
    com.subscription.hub: INFO
    ai.fabric: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  cors:
    # Example: CORS_ALLOWED_ORIGINS=https://ai-fabric.dev
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
    # Example: CORS_ALLOWED_ORIGIN_PATTERNS=https://ai-fabric.dev,https://*.lovable.app
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:}
    # Example: CORS_ALLOW_CREDENTIALS=true (only if the browser sends cookies/session auth)
    allow-credentials: ${CORS_ALLOW_CREDENTIALS:false}
