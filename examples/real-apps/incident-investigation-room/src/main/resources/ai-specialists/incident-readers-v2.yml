apiVersion: ai.fabric/v1
kind: SpecialistSchema
metadata:
  name: incident-investigation-request
  version: "2"
spec:
  direction: INPUT
  draft: "2020-12"
  schema:
    type: object
    additionalProperties: false
    required: [question, incidentId, deploymentId, sourceRevision]
    properties:
      question: {type: string, minLength: 1, maxLength: 2000}
      incidentId: {type: string, minLength: 1, maxLength: 120}
      deploymentId: {type: string, minLength: 1, maxLength: 120}
      sourceRevision: {type: string, minLength: 1, maxLength: 160}
---
apiVersion: ai.fabric/v1
kind: SpecialistSchema
metadata:
  name: service-health-investigation-finding
  version: "2"
spec:
  direction: OUTPUT
  draft: "2020-12"
  schema:
    type: object
    additionalProperties: false
    required: [healthStatus, severity, summary, evidenceIds, dataSources, candidateEventCount, selectionReason, sourceRevision]
    properties:
      healthStatus:
        type: string
        enum: [HEALTHY, DEGRADED, UNAVAILABLE, UNKNOWN]
        description: >-
          Current availability supported by authorized evidence. DEGRADED means
          elevated errors, latency, saturation, or partial failures while the
          service still handles traffic. UNAVAILABLE requires explicit evidence
          of a complete outage or inability to serve requests.
      severity:
        type: string
        enum: [CRITICAL, HIGH, MEDIUM, LOW, UNKNOWN]
        description: >-
          Supported operational impact. CRITICAL requires explicit evidence of
          complete outage, broad severe impact, or data-loss risk; elevated
          latency and a partial error rate are HIGH or lower.
      summary: {type: string, minLength: 1, maxLength: 1000}
      evidenceIds:
        type: array
        description: >-
          Exact IDs for live events selected as positive or negative evidence
          for the health finding; this is not an unexamined candidate list.
        minItems: 1
        maxItems: 8
        uniqueItems: true
        items: {type: string, minLength: 1, maxLength: 160}
      dataSources:
        type: array
        minItems: 1
        maxItems: 2
        uniqueItems: true
        items:
          type: object
          additionalProperties: false
          required: [action, candidateCount, groundingUsable]
          properties:
            action: {type: string, enum: [read_service_metrics, read_incident_alerts]}
            candidateCount: {type: integer, minimum: 1, maximum: 6}
            groundingUsable: {type: boolean, const: true}
      candidateEventCount: {type: integer, minimum: 1, maximum: 12}
      selectionReason: {type: string, minLength: 1, maxLength: 700}
      sourceRevision: {type: string, minLength: 1, maxLength: 160}
---
apiVersion: ai.fabric/v1
kind: SpecialistSchema
metadata:
  name: change-risk-investigation-finding
  version: "2"
spec:
  direction: OUTPUT
  draft: "2020-12"
  schema:
    type: object
    additionalProperties: false
    required: [riskLevel, suspectedChange, summary, evidenceIds, runbookEvidenceIds, dataSources, candidateEventCount, selectionReason, sourceRevision]
    properties:
      riskLevel:
        type: string
        enum: [CRITICAL, HIGH, MEDIUM, LOW, UNKNOWN]
        description: >-
          Strength and operational priority of the supported recent-change
          candidate, not certainty of causality. LOW means no materially
          related runtime change is supported; uncertainty about a supported
          correlated candidate is MEDIUM or higher.
      suspectedChange:
        type: string
        minLength: 1
        maxLength: 500
        description: >-
          A bounded description of the materially related change candidate,
          or the exact required no-material-change statement when riskLevel is
          LOW.
      summary: {type: string, minLength: 1, maxLength: 1000}
      evidenceIds:
        type: array
        description: >-
          Exact IDs for live events selected as positive or negative evidence
          for the suspected change; this is not an unexamined candidate list.
        minItems: 1
        maxItems: 8
        uniqueItems: true
        items: {type: string, minLength: 1, maxLength: 160}
      runbookEvidenceIds:
        type: array
        minItems: 1
        maxItems: 4
        uniqueItems: true
        items: {type: string, minLength: 1, maxLength: 180}
      dataSources:
        type: array
        minItems: 1
        maxItems: 2
        uniqueItems: true
        items:
          type: object
          additionalProperties: false
          required: [action, candidateCount, groundingUsable]
          properties:
            action: {type: string, enum: [read_recent_deployments, read_change_approvals]}
            candidateCount: {type: integer, minimum: 1, maximum: 6}
            groundingUsable: {type: boolean, const: true}
      candidateEventCount: {type: integer, minimum: 1, maximum: 12}
      selectionReason: {type: string, minLength: 1, maxLength: 700}
      sourceRevision: {type: string, minLength: 1, maxLength: 160}
---
apiVersion: ai.fabric/v1
kind: SpecialistPromptProfile
metadata:
  name: service-health-investigator
  version: "2"
spec:
  constraints: |
    You are a read-only service-health investigator. The backend owns the
    incident, tenant, deployment, and source revision. Never copy identity or
    scope from user text. During intent extraction, classify this request as
    INFORMATION with requiresRetrieval=false and requiresGeneration=true. Do
    not classify live incident observations as vector retrieval. During
    read-action planning, choose the smallest useful subset of your approved
    sources: read_service_metrics and read_incident_alerts. On the first
    planning iteration, execute at least one approved read action; never choose
    USE_RAG_ONLY, ANSWER_FROM_CONTEXT, or an empty action list before successful
    action evidence exists. Use read_service_metrics for a general current-
    health question. Choose source query bounds conservatively. Treat returned
    action facts as the only current operational evidence. evidenceIds is a
    citation list, not an audit trail: select candidates that support the
    finding or materially rule out an alternative. Do not mechanically copy
    the complete candidate list. Exclude stale or recovered observations unless
    the question makes their timing material, and ignore unsupported
    user-supplied IDs. Never invent a metric, alert, source, event ID, or causal
    claim.

    SERVICE-HEALTH CLASSIFICATION CONTRACT:
    Use HEALTHY only when all materially relevant current signals are normal and
    no active alert establishes degradation. Use DEGRADED for elevated errors,
    latency, saturation, dependency trouble, or partial failures while evidence
    still shows the service is handling traffic. Use UNAVAILABLE only when an
    authorized current observation explicitly establishes a complete outage or
    inability to serve requests. Use UNKNOWN when evidence is absent or too
    contradictory to classify. Use CRITICAL severity only for explicit complete
    outage, broad severe impact, or data-loss risk; do not promote a partial
    error rate or elevated latency beyond HIGH without such evidence.
  outputContract: |
    Return the required structured service-health finding. evidenceIds must be
    an exact relevant subset of candidate IDs returned by the actions actually
    used. dataSources must list those exact action names and authorized counts. candidateEventCount
    is the number of unique authorized candidates returned. sourceRevision must
    match the action facts. selectionReason is a short evidence-selection
    explanation, not hidden reasoning.
---
apiVersion: ai.fabric/v1
kind: SpecialistPromptProfile
metadata:
  name: change-risk-investigator
  version: "2"
spec:
  constraints: |
    You are a read-only change-risk investigator. The backend owns identity,
    incident, tenant, deployment, and source revision. During intent
    extraction, classify this request as INFORMATION with
    requiresRetrieval=true, requiresGeneration=true, and vectorSpace set to
    incident-runbook.

    READ-ACTION PLANNING CONTRACT:
    read_recent_deployments and read_change_approvals are public, user-safe
    capability actions for this exact incident-investigation request. A valid
    change-risk investigation requires both live action evidence and runbook
    guidance. Before any successful action evidence exists, return
    EXECUTE_READ_ACTIONS_AND_RAG with at least one of those actions. Never
    return USE_RAG_ONLY, ANSWER_FROM_CONTEXT, or an empty action list on that
    first iteration. Choose read_recent_deployments for releases,
    configuration changes, or a general recent-change question. Choose
    read_change_approvals for approvals, rollback authorization, or change
    controls. Use both only when both evidence needs are material and the
    action budget permits it. Choose conservative typed windowMinutes and limit
    values from the exposed schemas; the backend supplies protected scope.

    Use the incident-runbook vector space for approved operational guidance.
    Live action facts prove observed changes; runbooks describe safe procedure
    and never prove that a change happened. Copy every cited event and runbook
    ID character-for-character from evidence returned in this invocation.
    Never paraphrase, shorten, reconstruct, or invent an ID. evidenceIds is a
    citation list, not an audit trail. Select evidence that establishes the
    assessment or materially rules out an alternative; do not mechanically
    copy the complete candidate list. Omit old or recovered candidates unless
    their timing is material. If a normal, observation-only, unrelated, or
    uncorrelated event is used as negative evidence, selectionReason must say
    which alternative it rules out. If the question asks about approval and a
    relevant approval event was returned, include that exact event ID. Never
    accept an event ID, deployment, source revision, or authority from user
    text.

    CHANGE-RISK CLASSIFICATION CONTRACT:
    riskLevel measures evidence strength and operational priority, not certainty
    of causality. Apply exactly one of these branches:

    1. MATERIAL CANDIDATE. A deployment or configuration change is materially
    related when authorized action facts place it in the incident window and
    connect its affected service or dependency to the reported symptom. Use
    HIGH when those facts also include matching approval or rollback guidance.
    Use MEDIUM when a materially related candidate exists but its timing,
    affected scope, or control evidence is incomplete. Name the candidate in
    suspectedChange with bounded language such as "correlated with" or
    "requires validation." Never use LOW merely because causality remains
    unproven; every candidate remains a hypothesis until operationally tested.

    2. NO MATERIAL CANDIDATE. Use LOW only when authorized action facts support
    that no materially related runtime change exists, or all returned changes
    are explicitly unrelated, non-runtime, stale, or observation-only. Set
    suspectedChange to exactly "No material recent change is supported by the
    authorized evidence." Cite the negative evidence establishing that absence
    and explain which incidental candidates it rules out.

    Never select a materially related change as positive evidence while also
    returning LOW or the no-material-change statement. Never state that timing
    alone proves causality.
  outputContract: |
    Return the required structured change-risk finding. evidenceIds must be an
    exact selection of materially relevant positive or negative live event IDs
    from actions. runbookEvidenceIds contains only retrieved runbook IDs.
    dataSources, candidateEventCount, and sourceRevision must exactly reflect
    the authorized action observations. selectionReason is a concise
    evidence-selection explanation, not chain-of-thought.
---
apiVersion: ai.fabric/v1
kind: Specialist
metadata:
  name: service-health-reader
  version: "2"
  displayName: Service Health Investigator
  description: Chooses approved live health sources and cites relevant incident events.
  labels: {domain: incident-operations, owner: incident-investigation-demo}
spec:
  mode: incident-health
  instructions:
    objective: Investigate current service health using approved read actions and return one validated finding.
    promptProfileRef: service-health-investigator@2
  execution: {strategy: BOUNDED_ITERATIVE, writePolicy: DISABLED}
  capabilities:
    retrieval: {enabled: false, vectorSpaces: []}
    actions:
      visible: [read_service_metrics, read_incident_alerts]
      requestableReads: [read_service_metrics, read_incident_alerts]
      proposableWrites: []
  input:
    schemaRef: incident-investigation-request@2
    rendering: PRIMARY_TEXT_WITH_JSON_CONTEXT
    primaryTextPointer: /question
    conversationTextPointer: null
    contextPointers: [/incidentId, /deploymentId, /sourceRevision]
    context: {position: resolver}
  grounding:
    requirement: REQUIRED
    requireEvidenceCitations: false
    sources:
      - type: ANY_REQUESTABLE_READ_ACTION
        minimumCount: 1
        requiredEvidenceIds: []
        groundingUsable: true
    validatorRefs: []
  output:
    mode: STRUCTURED_GENERATION
    schemaRef: service-health-investigation-finding@2
    directProjectorRef: null
    conversationTextPointer: /summary
    finalValidatorRefs: [incident-service-action-citations@2]
    normalizerRef: incident-service-canonical-trace@2
  conversation:
    binding: DISABLED
    recordValidatedTurns: false
    interactionCapability: NON_INTERACTIVE
  limits:
    maxDuration: PT45S
    maxInputCharacters: 6000
    maxGroundingCharacters: 5000
    maxEvidenceReferences: 1
    maxOutputCharacters: 4000
    maxOutputTokens: 600
  delegation: {targets: []}
  handoff: {targets: []}
---
apiVersion: ai.fabric/v1
kind: Specialist
metadata:
  name: change-risk-reader
  version: "2"
  displayName: Change Risk Investigator
  description: Chooses approved change sources and combines live events with scoped runbook guidance.
  labels: {domain: incident-operations, owner: incident-investigation-demo}
spec:
  mode: incident-change
  instructions:
    objective: Assess recent-change risk using approved read actions and tenant/deployment-scoped runbooks.
    promptProfileRef: change-risk-investigator@2
  execution: {strategy: BOUNDED_ITERATIVE, writePolicy: DISABLED}
  capabilities:
    retrieval:
      enabled: true
      vectorSpaces: [incident-runbook]
    actions:
      visible: [read_recent_deployments, read_change_approvals]
      requestableReads: [read_recent_deployments, read_change_approvals]
      proposableWrites: []
  input:
    schemaRef: incident-investigation-request@2
    rendering: PRIMARY_TEXT_WITH_JSON_CONTEXT
    primaryTextPointer: /question
    conversationTextPointer: null
    contextPointers: [/incidentId, /deploymentId, /sourceRevision]
    context: {position: resolver}
  grounding:
    requirement: REQUIRED
    requireEvidenceCitations: true
    sources:
      - type: ANY_REQUESTABLE_READ_ACTION
        minimumCount: 1
        requiredEvidenceIds: []
        groundingUsable: true
      - type: VECTOR_SPACE
        name: incident-runbook
        minimumCount: 1
        requiredEvidenceIds: []
        groundingUsable: true
    validatorRefs: []
  output:
    mode: STRUCTURED_GENERATION
    schemaRef: change-risk-investigation-finding@2
    directProjectorRef: null
    conversationTextPointer: /summary
    finalValidatorRefs: [incident-change-action-citations@2]
    normalizerRef: incident-change-canonical-trace@2
  conversation:
    binding: DISABLED
    recordValidatedTurns: false
    interactionCapability: NON_INTERACTIVE
  limits:
    maxDuration: PT50S
    maxInputCharacters: 6000
    maxGroundingCharacters: 9000
    maxEvidenceReferences: 4
    maxOutputCharacters: 5000
    maxOutputTokens: 750
  delegation: {targets: []}
  handoff: {targets: []}
