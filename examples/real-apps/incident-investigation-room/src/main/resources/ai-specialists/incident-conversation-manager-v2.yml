apiVersion: ai.fabric/v1
kind: SpecialistSchema
metadata:
  name: incident-conversation-manager-input
  version: "2"
spec:
  direction: INPUT
  draft: "2020-12"
  schema:
    type: object
    additionalProperties: false
    required: [currentUserMessage, applicationContext, approvedTargets]
    properties:
      currentUserMessage: {type: string, minLength: 1, maxLength: 4000}
      applicationContext:
        type: array
        maxItems: 12
        items:
          type: object
          additionalProperties: false
          required: [name, value]
          properties:
            name: {type: string, pattern: "^[A-Za-z][A-Za-z0-9_.-]{0,99}$"}
            value: {type: string, minLength: 1, maxLength: 1000}
      approvedTargets:
        type: array
        minItems: 1
        maxItems: 2
        items:
          type: object
          additionalProperties: false
          required: [specialist, description]
          properties:
            specialist: {type: string, enum: [service-health-reader@2, change-risk-reader@2]}
            description: {type: string, minLength: 1, maxLength: 500}
---
apiVersion: ai.fabric/v1
kind: SpecialistSchema
metadata:
  name: incident-conversation-manager-directive
  version: "2"
spec:
  direction: OUTPUT
  draft: "2020-12"
  schema:
    type: object
    additionalProperties: false
    required: [type, targetSpecialist, message, reason]
    properties:
      type: {type: string, enum: [ASK_USER, INVOKE_SPECIALIST, COMPLETE]}
      targetSpecialist:
        type: [string, "null"]
        enum: [service-health-reader@2, change-risk-reader@2, null]
      message: {type: [string, "null"], maxLength: 2000}
      reason: {type: string, minLength: 1, maxLength: 500}
    allOf:
      - if: {properties: {type: {const: INVOKE_SPECIALIST}}}
        then:
          properties:
            targetSpecialist: {type: string, enum: [service-health-reader@2, change-risk-reader@2]}
            message: {type: "null"}
      - if: {properties: {type: {enum: [ASK_USER, COMPLETE]}}}
        then:
          properties:
            targetSpecialist: {type: "null"}
            message: {type: string, minLength: 1, maxLength: 2000}
---
apiVersion: ai.fabric/v1
kind: SpecialistPromptProfile
metadata:
  name: incident-conversation-manager
  version: "2"
spec:
  constraints: |
    Own one incident-investigation turn using the current message, bounded
    backend conversation history, immutable application context, and only the
    approved target descriptions. Use service-health-reader@2 for metrics,
    alerts, latency, errors, saturation, and availability. Use
    change-risk-reader@2 for releases, changes, approvals, rollback, and
    runbooks. Resolve short follow-ups against recent approved turns. If both
    branches are materially required, COMPLETE with a concise instruction to
    run the registered full plan. ASK_USER only when the operational need is
    genuinely ambiguous. Never create topology, invoke multiple targets, alter
    identity, or claim work ran before the gateway executes it.
  outputContract: Return one valid directive with an exact approved target or a concise user-facing message.
---
apiVersion: ai.fabric/v1
kind: Specialist
metadata:
  name: incident-conversation-manager
  version: "2"
  displayName: Incident Conversation Manager
  description: Uses backend-owned memory to select zero or one approved investigator per turn.
  labels: {domain: incident-operations, owner: incident-investigation-demo}
spec:
  mode: resolver
  instructions:
    objective: Ask one question, invoke one exact investigator, or direct the fixed full plan.
    promptProfileRef: incident-conversation-manager@2
  execution: {strategy: SINGLE_PASS, writePolicy: DISABLED}
  capabilities:
    retrieval: {enabled: false, vectorSpaces: []}
    actions: {visible: [], requestableReads: [], proposableWrites: []}
  input:
    schemaRef: incident-conversation-manager-input@2
    rendering: PRIMARY_TEXT_WITH_JSON_CONTEXT
    primaryTextPointer: /currentUserMessage
    conversationTextPointer: /currentUserMessage
    contextPointers: [/applicationContext, /approvedTargets]
    context: {position: resolver}
  grounding: {requirement: NONE, requireEvidenceCitations: false, sources: [], validatorRefs: []}
  output:
    mode: STRUCTURED_GENERATION
    schemaRef: incident-conversation-manager-directive@2
    directProjectorRef: null
    conversationTextPointer: null
    finalValidatorRefs: []
    normalizerRef: null
  conversation: {binding: REQUIRED, recordValidatedTurns: false, interactionCapability: DIALOGUE_CAPABLE}
  limits:
    maxDuration: PT45S
    maxInputCharacters: 12000
    maxGroundingCharacters: 1000
    maxEvidenceReferences: 1
    maxOutputCharacters: 2500
    maxOutputTokens: 350
  delegation: {targets: [service-health-reader@2, change-risk-reader@2]}
  handoff: {targets: []}
