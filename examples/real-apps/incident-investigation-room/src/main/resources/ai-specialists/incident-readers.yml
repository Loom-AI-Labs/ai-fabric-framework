    primaryTextPointer: /question
    conversationTextPointer: null
    contextPointers: [/incidentId, /deploymentId, /sourceRevision, /evidence]
    context: {position: resolver}
  grounding:
    requirement: NONE
    requireEvidenceCitations: false
    sources: []
    validatorRefs: []
  output:
    mode: STRUCTURED_GENERATION
    schemaRef: change-risk-finding@1
    directProjectorRef: null
    conversationTextPointer: /summary
    finalValidatorRefs: []
    normalizerRef: null
  conversation:
    binding: DISABLED
    recordValidatedTurns: false
    interactionCapability: NON_INTERACTIVE
  limits:
    maxDuration: PT35S
    maxInputCharacters: 8000
    maxGroundingCharacters: 1000
    maxEvidenceReferences: 1
    maxOutputCharacters: 2500
    maxOutputTokens: 350
  delegation:
