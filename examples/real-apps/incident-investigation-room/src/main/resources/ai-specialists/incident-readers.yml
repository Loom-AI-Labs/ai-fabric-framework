apiVersion: ai.fabric/v1
kind: SpecialistSchema
metadata:
  name: service-health-request
  version: "1"
spec:
  direction: INPUT
  draft: "2020-12"
  schema:
    type: object
    additionalProperties: false
    required: [question, incidentId, deploymentId, sourceRevision, evidence]
    properties:
      question: {type: string, minLength: 1, maxLength: 2000}
      incidentId: {type: string, minLength: 1, maxLength: 120}
      deploymentId: {type: string, minLength: 1, maxLength: 120}
      sourceRevision: {type: string, minLength: 1, maxLength: 160}
      evidence:
        type: array
        minItems: 1
        maxItems: 8
        items: &evidence_item
          type: object
          additionalProperties: false
          required: [id, category, summary, severity, observedAt]
          properties:
            id: {type: string, minLength: 1, maxLength: 160}
            category: {type: string, minLength: 1, maxLength: 80}
            summary: {type: string, minLength: 1, maxLength: 1200}
            severity: {type: string, minLength: 1, maxLength: 40}
            observedAt: {type: string, minLength: 1, maxLength: 80}
---
apiVersion: ai.fabric/v1
kind: SpecialistSchema
metadata:
  name: service-health-finding
  version: "1"
spec:
  direction: OUTPUT
  draft: "2020-12"
  schema:
    type: object
    additionalProperties: false
    required: [healthStatus, severity, summary, evidenceIds]
    properties:
      healthStatus:
        type: string
        enum: [HEALTHY, DEGRADED, UNAVAILABLE, UNKNOWN]
      severity:
        type: string
        enum: [CRITICAL, HIGH, MEDIUM, LOW, UNKNOWN]
      summary: {type: string, minLength: 1, maxLength: 1000}
      evidenceIds:
        type: array
        minItems: 1
        maxItems: 8
        uniqueItems: true
        items: {type: string, minLength: 1, maxLength: 160}
---
apiVersion: ai.fabric/v1
kind: SpecialistSchema
metadata:
  name: change-risk-request
  version: "1"
spec:
  direction: INPUT
  draft: "2020-12"
  schema:
    type: object
    additionalProperties: false
    required: [question, incidentId, deploymentId, sourceRevision, evidence]
    properties:
      question: {type: string, minLength: 1, maxLength: 2000}
      incidentId: {type: string, minLength: 1, maxLength: 120}
