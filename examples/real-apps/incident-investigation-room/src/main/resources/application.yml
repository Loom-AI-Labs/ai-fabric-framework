server:
  port: ${PORT:8107}
  forward-headers-strategy: framework

spring:
  application:
    name: incident-investigation-room
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/incident-investigation}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update

ai:
  enabled: true
  fabric:
    examples:
      demo-health:
        enabled: false
  execution:
    enabled: true
    output-finalization:
      max-attempts: 3
    manifests:
      enabled: true
      fail-fast: true
    capabilities:
      registered-vector-spaces:
        - incident-runbook
      allowed-actions:
        - read_service_metrics
        - read_incident_alerts
        - read_recent_deployments
        - read_change_approvals
    async:
      repository: IN_MEMORY
      core-pool-size: 4
      max-pool-size: 8
      queue-capacity: 32
      result-ttl: PT15M
    input-waits:
      enabled: false
    plans:
      enabled: true
      parallel-enabled: true
      max-parallel-branches: 2
      max-steps: 3
      max-duration: PT75S
      max-active: 500
      result-ttl: PT15M
    conversation-managers:
      enabled: true
      max-duration: PT75S
      max-active: 500
      result-ttl: PT15M
    specialist-chains:
      enabled: true
      max-active: 250
      max-duration: PT75S
      max-manager-decisions: 4
      max-worker-invocations: 2
      max-parallel-workers: 2
      max-invocations-per-target: 1
      max-projected-result-characters: 8000
      max-directive-corrections: 1
      durable-enabled: ${AI_SPECIALIST_CHAINS_DURABLE_ENABLED:true}
      allow-ephemeral: ${AI_SPECIALIST_CHAINS_ALLOW_EPHEMERAL:false}
      initialize-schema: ${AI_SPECIALIST_CHAINS_INITIALIZE_SCHEMA:true}
      lease-duration: PT2M
      recovery-interval: PT30S
      recovery-batch-size: 50
      max-attempts: 3
      cleanup-enabled: true
      retention: P7D
      encryption-secret: ${AI_SPECIALIST_CHAIN_ENCRYPTION_SECRET:}
      fingerprint-secret: ${AI_SPECIALIST_CHAIN_FINGERPRINT_SECRET:}
    receipts:
      enabled: false
    reviews:
      enabled: false
  chat:
    enabled: true
    auto-create-sessions: true
    window-size: 8
    max-context-chars: 5000
  providers:
    llm-provider: openai
    embedding-provider: openai
    openai:
      enabled: ${OPENAI_ENABLED:false}
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
      model: ${OPENAI_MODEL:gpt-4o-mini}
      embedding-model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
      embedding-dimensions: ${OPENAI_EMBEDDING_DIMENSIONS:512}
      timeout: ${OPENAI_TIMEOUT:60}
  vector-db:
    type: lucene
    lucene:
      index-path: ./data/incident-runbook-lucene-${OPENAI_EMBEDDING_DIMENSIONS:512}
      similarity-threshold: 0.0
  service:
    features:
      enable-generation: true
      enable-embeddings: true
      enable-search: true
      enable-rag: true
  orchestration:
    default-mode: resolver
    strict-mode-routing: true
    modes:
      resolver:
        actions-enabled: true
        actions-preferred: true
        retrieval-enabled: true
        retrieval-allowlist-required: true
        vector-space-selection-required: false
        information-mode: DETERMINISTIC_RAG_GENERATE
        rag:
          fanout-enabled: false
          max-spaces: 1
          top-k-per-space: 3
          similarity-threshold: 0.0
          max-documents-returned-to-client: 3
          max-documents-used-for-context: 3
          max-context-chars: 5000
          retrieval-vector-spaces-allowlist:
            - incident-runbook
        read-action-resolution:
          enabled: true
          planning-mode: ITERATIVE
          require-allowlist: true
          allowed-read-actions:
            - read_service_metrics
            - read_incident_alerts
            - read_recent_deployments
            - read_change_approvals
          max-iterations: 2
          max-actions-per-iteration: 1
          max-total-actions: 2
          max-parallel-actions: 1
          max-planner-context-chars: 5000
          max-action-evidence-chars-per-action: 4000
          rag-cooperation-mode: RAG_IF_ACTIONS_INSUFFICIENT
          require-grounding-eligible: true
      incident-health:
        actions-enabled: false
        actions-preferred: false
        retrieval-enabled: false
        retrieval-allowlist-required: false
        vector-space-selection-required: false
        information-mode: LLM_DRIVEN
        read-action-resolution:
          enabled: true
          planning-mode: ITERATIVE
          require-allowlist: true
          allowed-read-actions:
            - read_service_metrics
            - read_incident_alerts
          max-iterations: 2
          max-actions-per-iteration: 1
          max-total-actions: 2
          max-parallel-actions: 1
          max-planner-context-chars: 5000
          max-action-evidence-chars-per-action: 4000
          rag-cooperation-mode: NONE
          require-grounding-eligible: true
      incident-change:
        actions-enabled: false
        actions-preferred: false
        retrieval-enabled: true
        retrieval-allowlist-required: true
        vector-space-selection-required: false
        information-mode: DETERMINISTIC_RAG_GENERATE
        rag:
          fanout-enabled: false
          max-spaces: 1
          top-k-per-space: 3
          similarity-threshold: 0.0
          max-documents-returned-to-client: 3
          max-documents-used-for-context: 3
          max-context-chars: 5000
          retrieval-vector-spaces-allowlist:
            - incident-runbook
        read-action-resolution:
          enabled: true
          planning-mode: ITERATIVE
          require-allowlist: true
          allowed-read-actions:
            - read_recent_deployments
            - read_change_approvals
          max-iterations: 2
          max-actions-per-iteration: 1
          max-total-actions: 2
          max-parallel-actions: 1
          max-planner-context-chars: 5000
          max-action-evidence-chars-per-action: 4000
          rag-cooperation-mode: PARALLEL_ACTIONS_AND_RAG
          require-grounding-eligible: true
  behavior:
    enabled: false
  pii-detection:
    enabled: false

app:
  incident:
    sessions:
      ttl: ${APP_DEMO_SESSION_TTL:PT4H}
      max-active: ${APP_DEMO_MAX_SESSIONS:500}
      cleanup-cron: ${APP_DEMO_SESSION_CLEANUP_CRON:0 */15 * * * *}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:}
    allow-credentials: ${CORS_ALLOW_CREDENTIALS:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.ai.fabric.realapps.incident: INFO
    ai.fabric: INFO
