server:
  port: ${PORT:8093}

spring:
  application:
    name: privacy-first-customer-facing-support
  datasource:
    url: jdbc:h2:mem:privacy_support;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driverClassName: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false
    open-in-view: false

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:}
    allow-credentials: ${CORS_ALLOW_CREDENTIALS:false}

ai:
  enabled: true
  config:
    default-file: ai-entity-config.yml
  providers:
    embedding-provider: privacy-simple
  vector-db:
    type: lucene
  service:
    features:
      enable-embeddings: true
      enable-search: true
      enable-rag: false
      enable-generation: false
  governance:
    enabled: true
    catalog:
      mode: VECTOR
    deletion:
      enabled: true
    pii:
      enabled: true
      require-detection-service: true
      require-pipeline-step: false
  pii-detection:
    enabled: true
    mode: ${AI_PII_MODE:REDACT}
    detection-direction: ${AI_PII_DETECTION_DIRECTION:INPUT_OUTPUT}
    store-encrypted-original: ${AI_PII_STORE_ENCRYPTED_ORIGINAL:true}
    encryption-secret: ${AI_PII_ENCRYPTION_SECRET:}
    audit-logging-enabled: ${AI_PII_AUDIT_LOGGING_ENABLED:true}

logging:
  level:
    root: INFO
    ai.fabric.privacy.pii: INFO
