server:
  port: ${PORT:8110}
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax

spring:
  application:
    name: ai-fabric-conversation-handover-demo
  autoconfigure:
    exclude:
      - ai.fabric.config.AIInfrastructureAutoConfiguration
      - org.springframework.boot.data.jpa.autoconfigure.DataJpaRepositoriesAutoConfiguration
      - org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration
  datasource:
    url: ${DATABASE_URL:jdbc:h2:file:./data/conversation-handover;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: org.h2.Driver
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  demo:
    operator-access-code: ${APP_DEMO_OPERATOR_ACCESS_CODE:demo-handover}
