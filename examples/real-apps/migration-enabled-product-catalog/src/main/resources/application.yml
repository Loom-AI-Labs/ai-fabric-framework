server:
  port: ${PORT:8095}

spring:
  application:
    name: migration-enabled-product-catalog
  config:
    import: optional:classpath:ai-entity-config.yml
  datasource:
    url: jdbc:h2:mem:product_catalog;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driverClassName: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

ai:
  enabled: true
  providers:
    llm-provider: none
    embedding-provider: simple
  vector-db:
    type: lucene
  service:
    features:
      enable-generation: false
  indexing:
    enabled: true
    async-worker:
      enabled: true
      fixed-delay: PT0.5S
      batch-size: 25
  migration:
    enabled: true
    default-batch-size: 500
    default-rate-limit: 600
    max-concurrent-jobs: 1
    entity-fields:
      product:
        created-at-field: "createdAt"

logging:
  level:
    com.ai.fabric.realapps.migrationcatalog: INFO
    ai.fabric.migration: INFO
    ai.fabric.indexing: INFO
    ai.fabric: INFO
