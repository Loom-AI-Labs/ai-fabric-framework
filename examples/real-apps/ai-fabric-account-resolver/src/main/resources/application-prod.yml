spring:
  application:
    name: ai-fabric-account-resolver

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/subscriptiondb}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

ai:
  config:
    default-file: ai-entity-config.yml

  providers:
    llm-provider: openai
    embedding-provider: simple

    openai:
      enabled: ${OPENAI_ENABLED:true}
      model: ${OPENAI_MODEL:gpt-4o-mini}
      api-key: ${OPENAI_API_KEY:}
      base-url: https://api.openai.com/v1

  vector-db:
    type: ${AI_VECTOR_DB_TYPE:lucene}
    lucene:
      index-path: ${VECTOR_INDEX_PATH:./data/lucene-vector-index}

  orchestration:
    default-mode: resolver
    strict-mode-routing: true
    modes:
      resolver:
        actions-enabled: true
        actions-preferred: true
        retrieval-enabled: true
        retrieval-allowlist-required: true
        vector-space-selection-required: false
        information-mode: DETERMINISTIC_RAG_GENERATE
        expose-read-probe-fallback-attempt: true
        force-grounding-eligible-read-action-post-generation: true
        rag:
          fanout-enabled: true
          max-spaces: 2
          top-k-per-space: 3
          max-documents-returned-to-client: 4
          max-documents-used-for-context: 4
          max-context-chars: 3000
          retrieval-vector-spaces-allowlist:
            - account-resolution-policy
            - subscription-plan
        read-action-resolution:
          enabled: true
          planning-mode: ITERATIVE
          require-allowlist: true
          allowed-read-actions:
            - inspect_account_readiness
          max-iterations: 2
          max-actions-per-iteration: 1
          max-total-actions: 2
          max-parallel-actions: 1
          max-planner-context-chars: 3000
          max-action-evidence-chars-per-action: 1800
          rag-cooperation-mode: PARALLEL_ACTIONS_AND_RAG
          require-grounding-eligible: true

  behavior:
    enabled: true
    mode: LIGHT

  pii-detection:
    enabled: true
    mode: DETECT_ONLY

server:
  port: ${PORT:8080}
  error:
    include-message: always
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.subscription.hub: INFO
    ai.fabric: WARN
    org.springframework: WARN
    root: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:}
    allow-credentials: ${CORS_ALLOW_CREDENTIALS:false}
