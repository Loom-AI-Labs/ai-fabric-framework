server:
  port: ${PORT:8101}

spring:
  application:
    name: tenant-knowledge-portal

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:}
    allow-credentials: ${CORS_ALLOW_CREDENTIALS:false}

ai:
  providers:
    llm-provider: ${AI_LLM_PROVIDER:smoke}
    embedding-provider: ${AI_EMBEDDING_PROVIDER:smoke}
  vector-db:
    type: ${AI_VECTOR_DB_TYPE:memory}
