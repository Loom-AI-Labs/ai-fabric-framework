server:
  port: ${PORT:8101}

spring:
  application:
    name: tenant-knowledge-portal
  profiles:
    default: smoke

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:}
    allow-credentials: ${CORS_ALLOW_CREDENTIALS:false}

ai:
  providers:
    llm-provider: ${AI_LLM_PROVIDER:smoke}
    embedding-provider: ${AI_EMBEDDING_PROVIDER:smoke}
    openai:
      enabled: ${OPENAI_ENABLED:false}
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
      model: ${OPENAI_MODEL:gpt-4o-mini}
      embedding-model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
      embedding-dimensions: ${OPENAI_EMBEDDING_DIMENSIONS:}
  vector-db:
    type: ${AI_VECTOR_DB_TYPE:lucene}
    lucene:
      index-path: ${VECTOR_INDEX_PATH:./data/tenant-guard-lucene-index}
