server:
  port: ${PORT:8098}

spring:
  application:
    name: document-ingestion-workbench
  config:
    import: classpath:ai-entity-config.yml
  datasource:
    url: jdbc:h2:mem:documentingest;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 1MB
      max-request-size: 1MB

document-workbench:
  trusted-root: ${DOCUMENT_WORKBENCH_TRUSTED_ROOT:${java.io.tmpdir}/ai-fabric-document-workbench}
  entity-type: kb
  preview:
    max-characters: 400
    max-chunks: 25

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}

ai:
  enabled: true
  providers:
    embedding-provider: ${AI_EMBEDDING_PROVIDER:openai}
    openai:
      enabled: ${OPENAI_ENABLED:false}
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
      embedding-model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
      embedding-dimensions: ${OPENAI_EMBEDDING_DIMENSIONS:512}
      timeout: ${OPENAI_TIMEOUT:45}
  indexing:
    enabled: true
    documents:
      enabled: true
      max-documents-per-plan: 100
      max-chunks-per-plan: 500
      max-content-length-per-chunk: 10000
      max-total-content-length: 1000000
      max-metadata-entries-per-chunk: 32
      max-metadata-value-length: 512
      default-splitter:
        enabled: true
        chunk-size: 800
        min-chunk-size-chars: 200
        min-chunk-length-to-embed: 5
      metadata:
        allowed-application-keys:
        - originalFilename
        warn-on-drop: true
  vector-db:
    type: ${AI_VECTOR_DB_TYPE:lucene}
    lucene:
      index-path: ${AI_VECTOR_DB_LUCENE_INDEX_PATH:./data/document-knowledge-lucene-${OPENAI_EMBEDDING_DIMENSIONS:512}}
      vector-dimension: ${OPENAI_EMBEDDING_DIMENSIONS:512}
      similarity-threshold: 0.0
  pii-detection:
    enabled: false
  service:
    features:
      enable-embeddings: true
      enable-search: true
      enable-generation: false
      enable-rag: false

logging:
  level:
    com.ai.fabric.realapps.docingest: INFO
    ai.fabric: INFO
