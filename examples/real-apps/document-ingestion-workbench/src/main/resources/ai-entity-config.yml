ai-entities:
  kb:
    indexing:
      enabled: true
    searchable-fields:
    - name: content
      destinations:
      - SEMANTIC_SEARCH
      - RAG_CONTEXT
      preprocessing: NORMALIZE
      priority: 90
    metadata-fields:
    - name: _aiDocumentSourceId
      data-type: STRING
      destinations:
      - VECTOR_METADATA
      - API_RESPONSE
      required: true
    - name: _aiDocumentSourceVersion
      data-type: NUMBER
      destinations:
      - VECTOR_METADATA
      - API_RESPONSE
      required: true
    - name: _aiDocumentSourceName
      data-type: STRING
      destinations:
      - VECTOR_METADATA
      - API_RESPONSE
    - name: _aiDocumentId
      data-type: STRING
      destinations:
      - VECTOR_METADATA
      - API_RESPONSE
    - name: _aiDocumentChunkId
      data-type: STRING
      destinations:
      - VECTOR_METADATA
      - API_RESPONSE
      required: true
    - name: _aiDocumentChunkIndex
      data-type: NUMBER
      destinations:
      - VECTOR_METADATA
      - API_RESPONSE
    - name: _aiDocumentChunkCount
      data-type: NUMBER
      destinations:
      - VECTOR_METADATA
      - API_RESPONSE
    - name: _aiDocumentContentFingerprint
      data-type: STRING
      destinations:
      - VECTOR_METADATA
      - API_RESPONSE
    - name: _aiDocumentTenantId
      data-type: STRING
      destinations:
      - VECTOR_METADATA
      - API_RESPONSE
      required: true
    - name: _aiDocumentVisibility
      data-type: STRING
      destinations:
      - VECTOR_METADATA
      - API_RESPONSE
    - name: originalFilename
      data-type: STRING
      destinations:
      - VECTOR_METADATA
      - API_RESPONSE
