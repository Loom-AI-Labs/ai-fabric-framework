ai-entities:
  kb:
    indexing:
      enabled: true
    searchable-fields:
    - name: content
      destinations:
      - SEMANTIC_SEARCH
      - RAG_CONTEXT
      preprocessing: NORMALIZE
      priority: 90
    - name: sourceName
      destinations:
      - SEMANTIC_SEARCH
      - RAG_CONTEXT
      preprocessing: NORMALIZE
      priority: 70
    metadata-fields:
    - name: sourceId
      data-type: STRING
      destinations:
      - VECTOR_METADATA
      - API_RESPONSE
    - name: sourceName
      data-type: STRING
      destinations:
      - VECTOR_METADATA
      - API_RESPONSE
    - name: sourceVersion
      data-type: NUMBER
      destinations:
      - VECTOR_METADATA
      - API_RESPONSE
    - name: tenantId
      data-type: STRING
      destinations:
      - VECTOR_METADATA
      - API_RESPONSE
    - name: visibility
      data-type: STRING
      destinations:
      - VECTOR_METADATA
      - API_RESPONSE
    - name: originalFilename
      data-type: STRING
      destinations:
      - VECTOR_METADATA
      - API_RESPONSE
    - name: documentId
      data-type: STRING
      destinations:
      - VECTOR_METADATA
      - API_RESPONSE
    - name: chunkIndex
      data-type: NUMBER
      destinations:
      - VECTOR_METADATA
      - API_RESPONSE
    - name: chunkCount
      data-type: NUMBER
      destinations:
      - VECTOR_METADATA
      - API_RESPONSE
    - name: contentFingerprint
      data-type: STRING
      destinations:
      - VECTOR_METADATA
      - API_RESPONSE
