ai-entities:
  kb:
    entity-type: "kb"
    auto-embedding: true
    indexable: true
    enable-search: true
    searchable-fields:
      - name: "content"
        weight: 2.0
      - name: "sourceName"
        weight: 1.0
    embeddable-fields:
      - name: "content"
        model: "document-workbench"
        auto-generate: true
        include-in-similarity: true
      - name: "sourceName"
        model: "document-workbench"
        auto-generate: true
        include-in-similarity: true
    metadata-fields:
      - name: "sourceId"
        type: "string"
      - name: "sourceName"
        type: "string"
      - name: "sourceVersion"
        type: "integer"
      - name: "tenantId"
        type: "string"
      - name: "visibility"
        type: "string"
      - name: "originalFilename"
        type: "string"
      - name: "documentId"
        type: "string"
      - name: "chunkIndex"
        type: "integer"
      - name: "chunkCount"
        type: "integer"
      - name: "contentFingerprint"
        type: "string"
