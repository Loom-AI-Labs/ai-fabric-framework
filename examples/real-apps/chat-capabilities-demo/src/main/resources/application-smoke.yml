server:
  port: ${PORT:8097}

spring:
  datasource:
    url: jdbc:h2:mem:chat_capabilities_smoke;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE

ai:
  providers:
    # This app's packaged scenario smoke exercises typed intent and suggestion
    # contracts. Keep both LLM purposes on the app-local deterministic provider;
    # the generic smoke provider is only a boot-wiring fallback.
    llm-provider: chat-local
    orchestration:
      llm-provider: chat-local
    generation:
      llm-provider: chat-local
    embedding-provider: smoke

  vector-db:
    type: memory

  data-sync:
    enabled: true

  service:
    features:
      enable-generation: true
      enable-embeddings: true
      enable-search: true
      enable-rag: true
