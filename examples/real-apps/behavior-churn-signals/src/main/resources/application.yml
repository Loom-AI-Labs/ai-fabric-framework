server:
  port: ${PORT:8097}

spring:
  application:
    name: behavior-churn-signals
  datasource:
    url: ${APP_DATABASE_URL:jdbc:h2:file:./data/behavior_signals;MODE=PostgreSQL;DATABASE_TO_UPPER=false;DEFAULT_NULL_ORDERING=HIGH;AUTO_SERVER=TRUE}
    driverClassName: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  sql:
    init:
      mode: always

ai:
  enabled: true
  execution:
    enabled: true
    manifests:
      enabled: true
      fail-fast: true
    capabilities:
      registered-vector-spaces: []
      allowed-actions: []
    async:
      repository: JDBC
      initialize-schema: false
      core-pool-size: 2
      max-pool-size: 4
      queue-capacity: 24
      result-ttl: PT20M
      lease-duration: ${AI_EXECUTION_ASYNC_LEASE_DURATION:PT2M}
      recovery-interval: ${AI_EXECUTION_ASYNC_RECOVERY_INTERVAL:PT20S}
      recovery-batch-size: 50
      max-attempts: ${AI_EXECUTION_ASYNC_MAX_ATTEMPTS:3}
      cleanup-enabled: true
      retention: ${AI_EXECUTION_ASYNC_RETENTION:P7D}
      encryption-secret: ${AI_EXECUTION_ASYNC_ENCRYPTION_SECRET:}
      fingerprint-secret: ${AI_EXECUTION_ASYNC_FINGERPRINT_SECRET:}
    receipts:
      enabled: false
    reviews:
      enabled: false
  prompts:
    bundle:
      overlays:
        - v1-behavior-signals
  vector-db:
    type: false
  service:
    features:
      enable-embeddings: false
      enable-search: false
      enable-generation: true
  providers:
    llm-provider: ${AI_LLM_PROVIDER:behavior-local}
    openai:
      enabled: ${OPENAI_ENABLED:false}
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
      model: ${OPENAI_MODEL:gpt-4o-mini}
      timeout: 45
  orchestration:
    default-mode: resolver
    strict-mode-routing: true
    modes:
      resolver:
        actions-enabled: false
        actions-preferred: false
        retrieval-enabled: false
        information-mode: LLM_DRIVEN
  behavior:
    enabled: true
    mode: LIGHT

logging:
  level:
    com.ai.fabric.realapps.behavior: INFO
    ai.fabric.behavior: INFO
    ai.fabric: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  version: ${APP_VERSION:1.0.0-SNAPSHOT}
  build-info:
    path: ${APP_BUILD_INFO_PATH:file:/app/build-info.properties}
  behavior-demo:
    analysis:
      specialist-id: behavior-risk-analyst@1
      require-real-ai: ${APP_BEHAVIOR_DEMO_REQUIRE_REAL_AI:false}
    cleanup:
      enabled: ${APP_BEHAVIOR_DEMO_CLEANUP_ENABLED:true}
      ttl: ${APP_BEHAVIOR_DEMO_CLEANUP_TTL:PT6H}
      cron: ${APP_BEHAVIOR_DEMO_CLEANUP_CRON:0 */30 * * * *}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:}
    allow-credentials: ${CORS_ALLOW_CREDENTIALS:false}
