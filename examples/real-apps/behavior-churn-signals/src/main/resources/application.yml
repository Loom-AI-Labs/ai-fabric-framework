server:
  port: ${PORT:8097}

spring:
  application:
    name: behavior-churn-signals
  datasource:
    url: jdbc:h2:mem:behavior_signals;MODE=PostgreSQL;DATABASE_TO_UPPER=false;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    driverClassName: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  sql:
    init:
      mode: always

ai:
  vector-db:
    type: false
  service:
    features:
      enable-embeddings: false
      enable-search: false
      enable-generation: true
  providers:
    llm-provider: ${AI_LLM_PROVIDER:behavior-local}
    openai:
      enabled: ${OPENAI_ENABLED:false}
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
      model: ${OPENAI_MODEL:gpt-4o-mini}
      timeout: 45
  behavior:
    enabled: true
    mode: LIGHT

logging:
  level:
    com.ai.fabric.realapps.behavior: INFO
    ai.fabric.behavior: INFO
    ai.fabric: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  version: ${APP_VERSION:1.0.0-SNAPSHOT}
  build-info:
    path: ${APP_BUILD_INFO_PATH:file:/app/build-info.properties}
  behavior-demo:
    cleanup:
      enabled: ${APP_BEHAVIOR_DEMO_CLEANUP_ENABLED:true}
      ttl: ${APP_BEHAVIOR_DEMO_CLEANUP_TTL:PT6H}
      cron: ${APP_BEHAVIOR_DEMO_CLEANUP_CRON:0 */30 * * * *}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:}
    allow-credentials: ${CORS_ALLOW_CREDENTIALS:false}
