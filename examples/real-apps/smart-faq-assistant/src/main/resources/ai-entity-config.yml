ai-entities:
  faq-article:
    entity-type: "faq-article"
    auto-embedding: true
    indexable: true
    enable-search: true
    searchable-fields:
      - name: "title"
        weight: 2.0
      - name: "content"
        weight: 1.8
      - name: "category"
        weight: 1.0
      - name: "tags"
        weight: 1.0
    metadata-fields:
      - name: "category"
        type: "string"
      - name: "tags"
        type: "string"
