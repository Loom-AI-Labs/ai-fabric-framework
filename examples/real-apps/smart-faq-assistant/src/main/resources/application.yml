server:
  port: ${PORT:8094}

spring:
  application:
    name: smart-faq-assistant
  datasource:
    url: jdbc:h2:mem:faqdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driverClassName: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

ai:
  enabled: true
  config:
    default-file: ai-entity-config.yml
  providers:
    embedding-provider: simple
  vector-db:
    type: lucene
  pii-detection:
    enabled: false
  service:
    features:
      enable-generation: ${AI_FAQ_ENABLE_GENERATION:false}
      enable-rag: ${AI_FAQ_ENABLE_RAG:false}

logging:
  level:
    com.ai.fabric.realapps.faq: INFO
    com.ai.infrastructure: INFO
