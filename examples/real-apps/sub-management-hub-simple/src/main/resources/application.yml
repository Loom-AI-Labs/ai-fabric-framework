spring:
  application:
    name: subscription-management-hub
  config:
    import: optional:classpath:ai-entity-config.yml

  datasource:
    url: jdbc:h2:file:./data/subscriptiondb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

ai:
  enabled: true
  providers:
    llm-provider: openai
    embedding-provider: simple

    openai:
      enabled: ${OPENAI_ENABLED:false}
      api-key: ${OPENAI_API_KEY:}
      base-url: https://api.openai.com/v1
      model: gpt-4o-mini

  vector-db:
    type: lucene

  pii-detection:
    enabled: false
    mode: DETECT_ONLY

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

logging:
  level:
    com.subscription.hub: DEBUG
    ai.fabric: INFO

server:
  port: ${PORT:8080}
