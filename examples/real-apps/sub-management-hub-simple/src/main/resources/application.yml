spring:
  application:
    name: subscription-management-hub

  datasource:
    url: jdbc:h2:file:./data/subscriptiondb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

ai:
  enabled: true
  config:
    default-file: ai-entity-config.yml

  providers:
    llm-provider: cohere
    embedding-provider: simple

    cohere:
      enabled: ${COHERE_ENABLED:false}
      api-key: ${COHERE_API_KEY:}
      base-url: https://api.cohere.ai/v1
      model: command-r-plus

  vector-db:
    type: lucene

  pii-detection:
    enabled: false
    mode: DETECT_ONLY

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

logging:
  level:
    com.subscription.hub: DEBUG
    com.ai.infrastructure: INFO

server:
  port: ${PORT:8080}
